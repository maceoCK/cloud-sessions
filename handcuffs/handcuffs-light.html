<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chain handcuffs</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;

  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;

  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Fig 9 · chain handcuffs. Every colour is a kit token or a figure token defined here for both themes. */
.hc-stage{position:relative;touch-action:pan-y}
.hc-stage:focus{outline:none}
.hc-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.hc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* line weight: kit paths are non-scaling strokes, so a zoomed viewBox keeps them at --hc-w css px (B.5); --hc-k is written by live.js */
.hc-svg{--anatomy-weight:var(--hc-w, .6px)}
[data-part="jawA"]{cursor:grab}
.hc-stage[data-dragging],.hc-stage[data-dragging] [data-part="jawA"]{cursor:grabbing}
/* edge feather when zoomed (B.5): a crop reads as a camera crop, no line ends on a hard edge */
.hc-svg[data-zoomed]{-webkit-mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent),linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent),linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-composite:intersect}

/* cavity (C2 #43, craft §7): the rear cheek's top, the floor rings and the cavity-facing frame walls, darker for depth */
.hc-svg{--hc-cav-paper:#0d0d0d;--hc-cav-top:#101010;--hc-cav-s0:#0a0a0a;--hc-cav-s1:#0c0c0c;--hc-cav-s2:#0e0e0e;--hc-cav-s3:#111111;--hc-cav-lo:#343434;--hc-cav-faint:#222222;--hc-cav-mid:#565656;
  --hc-cut-top:#252525;--hc-cut-s0:#191919;--hc-cut-s1:#1c1c1c;--hc-cut-s2:#202020;--hc-cut-s3:#242424}
.iso[data-theme="light"] .hc-svg{--hc-cav-paper:#e6e6e3;--hc-cav-top:#e3e3e0;--hc-cav-s0:#cdcdca;--hc-cav-s1:#d4d4d1;--hc-cav-s2:#dadad7;--hc-cav-s3:#dfdfdc;--hc-cav-lo:#a3a3a7;--hc-cav-faint:#c6c6c9;--hc-cav-mid:#7d7d82;
  --hc-cut-top:#ffffff;--hc-cut-s0:#e7e7e4;--hc-cut-s1:#eeeeeb;--hc-cut-s2:#f3f3f1;--hc-cut-s3:#f8f8f6}
.hc-cavity{--anatomy-paper:var(--hc-cav-paper);--anatomy-top:var(--hc-cav-top);--anatomy-shade-0:var(--hc-cav-s0);--anatomy-shade-1:var(--hc-cav-s1);--anatomy-shade-2:var(--hc-cav-s2);--anatomy-shade-3:var(--hc-cav-s3);--anatomy-lo:var(--hc-cav-lo);--anatomy-faint:var(--hc-cav-faint);--anatomy-mid:var(--hc-cav-mid)}
/* milled section faces (window walls, keyhole and slot walls, the stud's milled top): a touch lighter than structure */
.hc-cut{--anatomy-top:var(--hc-cut-top);--anatomy-shade-0:var(--hc-cut-s0);--anatomy-shade-1:var(--hc-cut-s1);--anatomy-shade-2:var(--hc-cut-s2);--anatomy-shade-3:var(--hc-cut-s3)}

/* lit (E.5): pawl, spring and tab always carry data-lit; --l (0…1) mixes the lit and hi token pairs; --hc-burst widens the edge */
.hc-litable .iso-solid[data-lit]>.iso-top{fill:color-mix(in srgb,var(--anatomy-lit-top) calc(var(--l,0)*100%),var(--anatomy-top))}
.hc-litable .iso-solid[data-lit]>.iso-shade[data-shade="0"]{fill:color-mix(in srgb,var(--anatomy-lit-shade) calc(var(--l,0)*100%),var(--anatomy-shade-0))}
.hc-litable .iso-solid[data-lit]>.iso-shade[data-shade="1"]{fill:color-mix(in srgb,var(--anatomy-lit-shade) calc(var(--l,0)*100%),var(--anatomy-shade-1))}
.hc-litable .iso-solid[data-lit]>.iso-shade[data-shade="2"]{fill:color-mix(in srgb,var(--anatomy-lit-shade) calc(var(--l,0)*100%),var(--anatomy-shade-2))}
.hc-litable .iso-solid[data-lit]>.iso-shade[data-shade="3"]{fill:color-mix(in srgb,var(--anatomy-lit-shade) calc(var(--l,0)*100%),var(--anatomy-shade-3))}
.hc-litable .iso-solid[data-lit]>.iso-fill{fill:color-mix(in srgb,var(--anatomy-face) calc(var(--l,0)*100%),var(--anatomy-paper))}
.hc-litable .iso-solid[data-lit]>.iso-edge{stroke:color-mix(in srgb,var(--anatomy-lit) calc(var(--l,0)*100%),var(--anatomy-hi));stroke-width:calc(var(--anatomy-weight) * (1 + var(--hc-burst, 0) * .8))}

.hc-chapters{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.hc-chapter{display:inline-flex;align-items:baseline;gap:7px;padding:5px 10px;border:0;border-radius:999px;background:transparent;color:var(--anatomy-muted);font:12.5px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;box-shadow:inset 0 0 0 1px var(--anatomy-faint);transition:color 160ms var(--anatomy-ease),box-shadow 160ms var(--anatomy-ease)}
.hc-chapter:hover,.hc-chapter:focus-visible,.hc-chapter[data-on]{color:var(--anatomy-strong);box-shadow:inset 0 0 0 1px var(--anatomy-lo);outline:none}
.hc-num{font-family:var(--anatomy-mono);font-size:10px;color:var(--anatomy-muted)}

/* the key (C5): the bow ring's hole stays open (evenodd on the lathe's fill and top) */
.hc-key .iso-fill,.hc-key .iso-top{fill-rule:evenodd}
[data-part="keyOuter"],[data-part="keyInner"]{cursor:grab}
/* halos on the undrawn surface under the cuffs, the chain, cuff A's strand and the key lying flat (C1 #36–41): the only sign of
   the surface (no board). Blur and offset are in user units: wider than the board-era 4 px / 1.5 px (at 2.69 px/mm), so that at
   3.39 px/mm a soft fringe shows past each item's outline and reads as a contact shadow (the kit's own halo is 9 px / 3 px).
   The key's fades (--hc-kh, written by live.js) as the key leaves the surface */
.hc-svg .hc-halo{filter:blur(7px);transform:translateY(3px)}
.hc-svg [data-part="keyHalo"]{opacity:calc(var(--anatomy-halo-opacity) * var(--hc-kh, 1))}
/* cuff B (C8): static, so its lines step down one tone (hi → mid, mid → lo); fills are unchanged */
.hc-svg .hc-dim [data-tone="hi"]{stroke:var(--anatomy-mid)}
.hc-svg .hc-dim [data-tone="mid"]{stroke:var(--anatomy-lo)}

7L102.6 495.6L104 495.8L105.4 496.1L106.7 496.6L107.8 497.2L108.8 498L109.6 498.9L109.8 499.2L110.4 500.2L110.7 501.3L110.8 502.4L110.6 503.5L110.2 504.5L109.5 505.5L108.6 506.4L107.5 507.1L106.3 507.7L104.9 508.2L103.5 508.4L102 508.5L100.5 508.3L99.1 508L97.8 507.5L96.6 506.9L95.6 506L94.8 505.1L94.3 504.1L93.9 503Z"/></g></g></g></svg><span class="hc-sr" role="status" aria-live="polite" data-status></span></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Lit: the lock part doing the work now: the pawl or the spring</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Single strand: 23 positions, 2.6° apart</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>One folded leaf spring is both pawl spring and double lock</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Standard key: hollow barrel on a post, the flag does the work</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Left cuff: at its last click and double-locked</span></span><span class="hc-chapters" role="group" aria-label="Chapters"><button type="button" class="hc-chapter" data-chapter="1"><span class="hc-num">01</span>Close</button><button type="button" class="hc-chapter" data-chapter="2"><span class="hc-num">02</span>Double-lock</button><button type="button" class="hc-chapter" data-chapter="3"><span class="hc-num">03</span>Unlock</button></span><span class="iso-caption">A Smith &amp; Wesson Model 100-pattern pair, the right cuff's lock milled open. Swung in, the single strand clicks through 23 positions 2.6° apart, and each click takes 3 mm off the inside, from 213 mm round at the first to 147 mm at the last. Its teeth cam a 31 mm pawl up 3.6° and the pawl snaps down behind each one, so square faces stop the strand being pulled back. Pushed along the slot toward the keyhole, the key's pin slides the pawl's own folded leaf spring 4 mm and parks a U-bend 0.6 mm above the pawl: the teeth can now rise only 0.43 mm of the 1.2 mm they need, so the cuff can neither tighten nor be shimmed. To open it, the key's 2.54 mm bore slides over a 2.24 mm post. Turned toward the chain, its flag meets the spring at 118° and pushes it off by 194°. Turned back the other way, it catches the pawl's shoulder at 46°, the teeth clear at 76°, and the strand swings out. Contact angles come from a solver on the patent geometry (US 4,287,731); real cuffs vary by a few degrees.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);

function frameAlong(o, a) {

const frameOf = (o, a, u, v) => ({ o, a, u, v });

function pointOf(F, s, r, angle) {

    F.o[1] + F.a[1] * s + r * (c * F.u[1] + n * F.v[1]),
    F.o[2] + F.a[2] * s + r * (c * F.u[2] + n * F.v[2]),

const radialOf = (F, angle) => {
  const c = Math.cos(angle);

const tangentOf = (F, angle) => {
  const c = Math.cos(angle);

const angleToward = (F, direction) => Math.atan2(dot3(direction, F.v), dot3(direction, F.u));

function hullTagged(points) {
  const sorted = [...points].sort((a, b) => a.p[0] - b.p[0] || a.p[1] - b.p[1]);

  const cross = (o, a, b) => (a.p[0] - o.p[0]) * (b.p[1] - o.p[1]) - (a.p[1] - o.p[1]) * (b.p[0] - o.p[0]);

  for (const point of sorted) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 1e-9) lower.pop();
    lower.push(point);
  }
  const upper = [];
  for (let index = sorted.length - 1; index >= 0; index--) {
    const point = sorted[index];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 1e-9) upper.pop();
    upper.push(point);

const hullOf = (points) => hullTagged(points.map((p) => ({ p }))).map(({ p }) => p);

function runsOf(flags) {
  const count = flags.length;
  const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
  if (start < 0) return flags[0] ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
  const runs = [];
  let run = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    if (flags[index]) {
      if (!run) run = [index];
      run.push((index + 1) % count);
    } else if (run) {
      runs.push(run);
      run = null;
    }
  }
  if (run) runs.push(run);
  return runs;
}

function groupsOf(keys) {
  const count = keys.length;
  const out = [];
  const start = keys.findIndex((key, index) => key !== keys[(index + count - 1) % count]);
  if (start < 0) {
    if (keys[0] !== null) out.push({ key: keys[0], run: Array.from({ length: count + 1 }, (_, index) => index % count) });
    return out;
  }
  let current = null;
  for (let step = 0; step < count; step++) {
    const index = (start + step) % count;
    const key = keys[index];
    if (current && current.key === key) {
      current.run.push((index + 1) % count);
      continue;
    }
    if (current && current.key !== null) out.push(current);
    current = { key, run: [index, (index + 1) % count] };
  }
  if (current && current.key !== null) out.push(current);
  return out;
}

const stepsFor = (radius, least = 16, most = 112, scale = 0) => Math.max(least, Math.min(most, scale ? Math.ceil((TAU * radius * scale) / 3) : Math.round((radius * 1.3) / 4) * 4));

function chains(edges) {
  const out = [];
  let current = null;
  for (const [a, b, keep] of edges) {
    if (!keep) {
      if (current) out.push(current);
      current = null;
      continue;
    }
    if (!current) current = [a];
    current.push(b);
  }
  if (current) out.push(current);
  if (out.length > 1 && edges[0][2] && edges[edges.length - 1][2]) {
    const last = out.pop();
    out[0] = [...last, ...out[0].slice(1)];

}

function labelledArcs(nr, na, view, light, gr = nr, ga = na) {

      cuts.push(view.phi - d, view.phi + d);
    }

  if (Math.abs(nr) > 1e-9) {
    for (const threshold of BANDS) {
      const c = (threshold - na * light.a) / (nr * light.flat);
      if (c > -1 && c < 1) {
        const d = Math.acos(c);
        cuts.push(light.phi - d, light.phi + d);
      }

  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const sorted = [...new Set(cuts.map((angle) => Math.round(wrap(angle) * 1e9) / 1e9))].sort((a, b) => a - b);
  const label = (angle) => {
    const facing = gr * view.flat * Math.cos(angle - view.phi) + ga * view.a;
    if (facing <= 1e-9) return -1;
    return bandOf(nr * light.flat * Math.cos(angle - light.phi) + na * light.a);
  };
  if (!sorted.length) {
    const tone = label(0);
    return tone < 0 ? [] : [{ tone, from: 0, to: TAU, full: true }];
  }
  const arcs = sorted.map((from, index) => {
    const to = index + 1 < sorted.length ? sorted[index + 1] : sorted[0] + TAU;
    return { tone: label((from + to) / 2), from, to };
  });
  const merged = [];
  for (const arc of arcs) {
    const last = merged[merged.length - 1];
    if (last && last.tone === arc.tone && Math.abs(last.to - arc.from) < 1e-9) last.to = arc.to;
    else merged.push({ ...arc });
  }
  if (merged.length > 1 && merged[0].tone === merged[merged.length - 1].tone && Math.abs(merged[merged.length - 1].to - TAU - merged[0].from) < 1e-9) {
    const last = merged.pop();
    merged[0].from = last.from - TAU;
  }
  return merged.filter((arc) => arc.tone >= 0);
}

function hermiteSlopes(run) {
  const n = run.length - 1;
  const h = Array.from({ length: n }, (_, j) => run[j + 1][0] - run[j][0]);
  const delta = h.map((value, j) => (run[j + 1][1] - run[j][1]) / value);
  const d = new Array(n + 1).fill(0);
  const end = (h0, h1, d0, d1) => {
    let value = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(value) !== Math.sign(d0)) value = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(value) > Math.abs(3 * d0)) value = 3 * d0;
    return value;
  };
  if (n === 1) d[0] = d[1] = delta[0];
  else {
    d[0] = end(h[0], h[1], delta[0], delta[1]);
    d[n] = end(h[n - 1], h[n - 2], delta[n - 1], delta[n - 2]);
  }
  for (let k = 1; k < n; k++) {
    if (delta[k - 1] * delta[k] <= 0) continue;
    const w1 = 2 * h[k] + h[k - 1];
    const w2 = h[k] + 2 * h[k - 1];
    d[k] = (w1 + w2) / (w1 / delta[k - 1] + w2 / delta[k]);
  }
  return d;
}

function curveRuns(meridian) {
  const m = meridian.length;
  const segments = new Array(m - 1).fill(null);
  let start = 0;
  while (start < m - 1) {
    let end = start + 1;
    while (end < m - 1 && meridian[end][2] && Math.abs(meridian[end + 1][0] - meridian[end][0]) > 1e-9 && Math.abs(meridian[end][0] - meridian[end - 1][0]) > 1e-9) end++;
    const run = meridian.slice(start, end + 1);
    const n = run.length - 1;
    if (n >= 2 && run.every((point, j) => j === 0 || Math.abs(point[0] - run[j - 1][0]) > 1e-9)) {
      const d = hermiteSlopes(run);
      for (let j = 0; j < n; j++) {
        const [s0, r0] = run[j];
        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };

    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);

    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {

  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];

    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;

    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];

      return [sign / length, (-sign * g) / length];

    const b = vertexNormal(i + 1, faces[i]);

    const y = a[1] + (b[1] - a[1]) * u;

    const count = Math.max(1, Math.ceil((to - from) / fine));

  };

    let mid = (arc.from + arc.to) / 2 - reference;

      out.to -= TAU;

          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));

  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));

  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];

    for (const arc of below) {

      let score = -Infinity;
      for (const entry of above) {

        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);

      if (best && score > -0.05) {

        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;

    }

  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;

        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));

      const mid = levelOf(i, (a.u + b.u) / 2);

        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);

  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;

  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);
  const segments = curveRuns(profile);
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const find = (s) => {
    let lo = 0;
    let hi = profile.length - 2;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (profile[mid][0] <= s) lo = mid;
      else hi = mid - 1;
    }
    return lo;
  };
  const linear = (index, s) => {
    const [sa, ra] = profile[index];
    const [sb, rb] = profile[index + 1];
    return [ra + ((rb - ra) * (s - sa)) / (sb - sa), (rb - ra) / (sb - sa)];
  };
  const radiusAt = radius ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].radius(at) : linear(index, at)[0];
  });
  const slopeAt = slope ?? ((s) => {
    const at = Math.max(s0, Math.min(s1, s));
    const index = find(at);
    return segments[index] ? segments[index].slope(at) : linear(index, at)[1];
  });
  return { s0, s1, radius: radiusAt, slope: slopeAt, analytic: Boolean(slope && radius) };
}

function bandsOf(profile, cuts, F, P, { slope = null, radius = null, steps, rows = 6, rims = "none", fill = "auto", samples = 72 } = {}) {
  const curve = profileCurve(profile, { slope, radius });
  const { s0, s1 } = curve;
  const stops = [s0, ...[...new Set(cuts)].filter((s) => s > s0 + 1e-6 && s < s1 - 1e-6).sort((a, b) => a - b), s1];
  const most = Math.max(...profile.map(([, r]) => r), ...stops.map((s) => curve.radius(s)));
  const n = steps ?? stepsFor(most, 32, 160, scaleOf(P));
  const knot = (s, soft) => (soft ? [s, curve.radius(s), 1] : [s, curve.radius(s)]);
  const meridianOf = (a, b) => [knot(a), ...profile.filter(([s]) => s > a + 1e-9 && s < b - 1e-9).map(([s, , soft]) => knot(s, soft)), knot(b)];
  const shading = { slope: curve.slope, radius: curve.radius, rows };
  const bands = stops.slice(0, -1).map((a, index) => {
    const b = stops[index + 1];
    const meridian = meridianOf(a, b);
    const paths = lathe(meridian, F, P, { steps: n, rims, fill, smooth: shading });
    const seam = index < stops.length - 2 ? arcOf(F, b, curve.radius(b), P, { slope: curve.slope(b) }) : "";
    return { s0: a, s1: b, profile: meridian, paths: { ...paths, outline: "" }, outline: paths.outline, seam };
  });
  const sidesOf = (from = s0, to = s1, { ends = false, count = samples } = {}) => {
    const span = [Math.max(s0, from), Math.min(s1, to)];
    const dense = Array.from({ length: count + 1 }, (_, index) => knot(span[0] + ((span[1] - span[0]) * index) / count, true));
    const points = silhouettePoints(dense, F, P, { samples: count, slope: curve.slope, radius: curve.radius });
    const rim = (s) => arcOf(F, s, curve.radius(s), P, { slope: curve.slope(s) });
    const rimsAt = ends === true ? span : ends === "first" ? [span[0]] : ends === "last" ? [span[1]] : [];
    return { d: points.map((list) => pathOf(list.map((point) => iso(point, P)))).join("") + rimsAt.map(rim).join(""), points };
  };
  return { bands, sidesOf, radius: curve.radius, slope: curve.slope, steps: n, s0, s1 };
}

function arcOf(F, s, r, P, { slope = 0, steps = 0, least = 0.02, inward = false, from = 0, to = TAU, trim = 0.3 } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const flat = Math.hypot(uV, vV);
  const phi = Math.atan2(vV, uV);
  const norm = Math.hypot(1, slope);
  const full = Math.abs(to - from - TAU) < 1e-9;
  let visible;
  if (flat < 1e-9) visible = (inward ? slope * aV / norm > least : -slope * aV / norm > least) ? [[phi, phi + TAU]] : [];
  else if (inward) {
    const c = (slope * aV - least * norm) / flat;
    visible = c <= -1 ? [] : c >= 1 ? [[phi, phi + TAU]] : [[phi + Math.acos(c), phi + TAU - Math.acos(c)]];
  } else {
    const c = (least * norm + slope * aV) / flat;
    visible = c >= 1 ? [] : c <= -1 ? [[phi, phi + TAU]] : [[phi - Math.acos(c), phi + Math.acos(c)]];
  }
  const at = (t) => iso(pointOf(F, s, r, t), P);
  const speed = (t) => {
    const a = at(t - 1e-3);
    const b = at(t + 1e-3);
    return Math.hypot(b[0] - a[0], b[1] - a[1]) / 2e-3;
  };
  const count = (span) => Math.max(2, Math.ceil(((steps || stepsFor(r, 24, 112)) * span) / TAU), Math.ceil((span * r * scaleOf(P)) / 1.5));
  const out = [];
  for (const [a, b] of visible) {
    if (b - a >= TAU - 1e-9 && full) {
      const n = count(TAU);
      out.push(pathOf(Array.from({ length: n }, (_, j) => at(from + (j / n) * TAU)), true));
      continue;
    }
    const pieces = full ? [[a, b, true, true]] : [];
    if (!full)

    return [S(0.7, turnTo(0), { words: n === 0 ? "key back · pawl drops to its stud" : "" })];
  }
  if (n === 0) return s.u >= 3.9 ? keyGo("keyhole") : closeSteps();
  if (ph === "LOCKED") return lastBeat !== "pull" ? pullSteps() : doubleLockSteps();
  if (ph === "DOUBLE") return lastBeat !== "squeeze" ? squeezeSteps() : keyGo("keyhole");
  return [];
}
// ---- chapters (E.4): 01 Close = A0–A5, 02 Double-lock = A6–A10, 03 Unlock = A11–A23. A button (or 1–3) first arms: it plays
// the director's own beats toward the chapter's precondition, 1.6× fast with `arming · …` words (never a snap), then the beats
const chapterOf = (name) => (/^A\d+$/.test(name ?? "") ? (Number(name.slice(1)) <= 5 ? 1 : Number(name.slice(1)) <= 10 ? 2 : 3) : 0);
const chapterBtns = [...document.querySelectorAll(".hc-chapter")];
let arming = 0, shownChapter = -1;
const restKey = () => stationOf() === "rest";
const READY = {
  1: () => isRest(),
  2: () => restKey() && s.notch > 0 && s.u < 0.05 && Math.abs(s.key.kappa) < 0.5,       // LOCKED(n), the key lying flat
  // DOUBLE(n) with the key in the slot (02's end: pin held), in the air, or lying flat; 03 takes it from there to the keyhole
  3: () => (stationOf() === "slot" || stationOf() === "air" || restKey()) && s.notch > 0 && s.u >= 3.9,
};
// toward REST by the next-beat table, except that a locked cuff with the key out is unlocked at once (no pull or squeeze test);
// a key in the slot or the air after 02 goes straight to the keyhole
function towardRest() {
  if ((restKey() || stationOf() === "air" || (stationOf() === "slot" && s.u >= 3.99)) && s.notch > 0) return keyGo("keyhole");
  if (restKey() && s.notch === 0 && s.u < 0.05 && s.theta > M.THETA_OPEN + 5) return [S(1.2, jawTo(M.THETA_OPEN), { cam: "pair" })];
  return nextBeatSteps();
}
function armSteps(c) {
  if (c >= 2 && isRest()) return closeSteps();                                 // from OPEN: close to 9
  if (c === 3 && READY[2]()) return doubleLockSteps();                         // 03 from LOCKED: double-lock first
  return towardRest();
}
// 03's first beats (A11–A12) leave from the slot; with the key lying flat or in the air they are its flight to the keyhole
function chapterSteps(c) {
  const list = loopA(c === 1 ? 9 : s.notch).filter((st) => chapterOf(st.name) === c);
  if (c !== 3 || stationOf() === "slot") return list;
  const go = keyGo("keyhole").map((st, i) => ({ ...st, name: i === 0 ? "A11" : "A12" }));
  return [...go, ...list.filter((st) => st.name !== "A11" && st.name !== "A12")];
}
function markChapter(c) {
  if (c === shownChapter) return;
  shownChapter = c;
  for (const b of chapterBtns) { const on = Number(b.dataset.chapter) === c; b.toggleAttribute("data-on", on); b.setAttribute("aria-pressed", String(on)); }
}
function chapter(c) { takeOver(); arming = c; markChapter(c); run(); }
for (const b of chapterBtns) b.addEventListener("click", () => chapter(Number(b.dataset.chapter)));
// the arming words fit the 36-character readout: cut back to a whole " · " clause when that keeps two words or more, else to a
// whole word, never ending on a small connecting word ("detent parked 0.6 mm over pawl" → "detent parked 0.6 mm")
const SMALL = new Set(["to", "the", "of", "over", "under", "at", "in", "on", "by", "up", "with", "and", "·"]);
function armOf(t) {
  const fits = (w) => `arming · ${w}`.length <= 36;
  if (fits(t)) return `arming · ${t}`;
  let w = t;
  while (!fits(w) && w.includes(" · ")) w = w.slice(0, w.lastIndexOf(" · "));
  if (!fits(w) || w.split(" ").length < 2) {
    const words = t.split(" ");
    while (words.length > 1 && (!fits(words.join(" ")) || SMALL.has(words[words.length - 1]))) words.pop();
    w = words.join(" ");
  }
  return `arming · ${w}`;
}
// the runner: one step at a time; the tour refills the queue (Loop A from REST, else the next beat until REST)
let touring = false, tourAt = -1, hoverPause = false, resumeTimer = 0, stepWords = "", wordsAt = -1;
function runSteps(dt, calm) {
  if (!cur) {
    if (!queue.length && arming) {
      if (READY[arming]()) { queue = chapterSteps(arming); arming = 0; }
      else { const c = arming; queue = armSteps(c).map((st) => ({ ...st, dur: st.dur / 1.6, chap: c })); if (!queue.length) arming = 0; }
    }
    if (!queue.length && touring && !hoverPause) queue = isRest() ? loopA() : nextBeatSteps();
    if (!queue.length) { stepWords = ""; markChapter(0); return false; }
    cur = queue.shift(); stepT = 0; cur.first = true;
    markChapter(arming || cur.chap || chapterOf(cur.name));
    if (cur.words) { wordsAt = clock; held.until = -1; }                        // a worded step's words win over an older held event
    if (cur.cam && !(drag && !drag.tap)) framing = cur.cam;
    if (cur.beat) lastBeat = cur.beat;
  }
  stepT += calm ? cur.dur : dt;
  const f = Math.min(1, stepT / cur.dur);
  for (const act of cur.acts) act(f, cur.first);
  cur.first = false;
  stepWords = cur.words ?? "";
  if (f >= 1) cur = null;
  return true;
}
function takeOver() {
  // the visible state becomes the target only when a tour, step or queue was driving it; otherwise the reader's own targets
  // stand, so quick repeated presses add up (S3 gate round 3: three quick → land on position 3, as in S1 and S2)
  const busy = touring || cur || queue.length;
  touring = false; queue = []; cur = null; stepWords = ""; arming = 0;
  if (tourAt >= 0) tourAt = Infinity;                                         // input before the tour's start cancels it too
  if (busy) { want = s.theta; cmd.x = s.theta; cmd.v = 0; kWant = s.key.kappa; }
  clearTimeout(resumeTimer);
  if (!still.matches) resumeTimer = setTimeout(() => { touring = true; run(); }, 3600);
}
const play = (list) => { takeOver(); queue = list; run(); };
// κ follower: the pointer is followed with τ 0.08 s; keys and the director hand the model their target (it limits to 240°/s)
let kMode = "direct", kCmd = 0, kLast = 0;
function kFollow(dt, calm) {
  if (calm || kMode !== "pointer") { kCmd = kWant; return kWant; }
  kCmd += (kWant - kCmd) * (1 - Math.exp(-dt / 0.08));
  return kCmd;
}
// lit owner switches at the contact event (E.5); bursts from each event's age (E.2)
function setOwner(o) { litOwner = o; }
function mark(kind) { eventAt = clock; eventKind = kind; }
function onEvents() {
  for (const e of s.events) {
    if (e.type === "touch") { setOwner(e.what === "shoulder" ? "pawl" : "spring"); mark("touch"); }
    else if (e.type === "stall") { setOwner("spring"); litBack = clock + 0.6; mark("stall"); if (document.activeElement === stage) statusEl.textContent = "still double-locked: turn toward the swivel first"; }
    else if (e.type === "blocked") { if (e.why === "double lock") setOwner("spring"); mark("stall"); }
    else if (e.type === "stop" || e.type === "dl" || e.type === "clear") mark("stop");
  }
  if (litBack > 0 && clock >= litBack) { litBack = -1; setOwner("pawl"); }
}
function stepLit(dt, calm) {
  const a = settle(lit.pawl, litOwner === "pawl" ? 1 : 0, dt, 0.18, calm), b = settle(lit.spring, litOwner === "spring" ? 1 : 0, dt, 0.18, calm);
  pawlEl.style.setProperty("--l", lit.pawl.x.toFixed(3));
  springEl.style.setProperty("--l", lit.spring.x.toFixed(3));
  tabEl.style.setProperty("--l", lit.spring.x.toFixed(3));
  return a || b;
}

// ---- intents
const notchOfWant = () => (want < M.THETA1 ? 0 : M.notchAt(want));
function squeeze(clicks) {
  cmd.mode = "key"; pull = null;
  const n = notchOfWant();
  want = n === 0 ? M.thetaOf(1) + M.PITCH * (clicks - 1) : M.thetaOf(Math.min(M.NPOS, n + clicks));
  want = Math.min(want, M.thetaOf(M.NPOS));
  lastBeat = "squeeze";
  run();
}
function pullOpen(clicks, full = false) {
  cmd.mode = "key";
  if (s.notch === 0 && s.theta <= M.THETA_FREE_OPEN) { want = M.THETA_OPEN; pull = null; }
  else {
    want = full ? M.THETA_OPEN : (s.notch > 0 ? M.thetaOf(s.notch) : s.theta) - M.PITCH * clicks;
    pull = { until: clock + 0.8 };                    // the hand pulls for 0.8 s, then lets go (U.1 A5)
  }
  lastBeat = "pull";
  run();
}
function release() { pull = null; want = s.theta; cmd.x = s.theta; cmd.v = 0; run(); }
function nextBeat() {                                // Space, Enter, a tap: the next beat from the state (E.4), after any step in progress
  if ((cur || queue.length) && !touring) return;                            // it waits while a beat is playing
  takeOver();                                                                  // the tour hands over from the visible state
  const list = nextBeatSteps();
  queue = list; run();
}
// key intents (E.4 keys): ↑/↓ turn 15° (Shift: to the next stop), K rest or slot → keyhole, seated → rest, D double-lock, 0 key back to 0°
const seated = () => stationOf() === "keyhole" && kp.tip[2] <= SEATED[2] + 1e-6;
function turnBy(dir, toStop) {
  if (!seated()) { play([...keyGo("keyhole")]); return; }                      // arming: the key goes in first
  takeOver();
  const stops = dir > 0 ? [M.KEY.touchFlange, M.KEY.dlReleased, M.KEY.endTurn1] : [M.KEY.touchShoulder, M.KEY.stallOn, M.KEY.teethClear, M.KEY.endOff].map((v) => v);
  const k0 = s.key.kappa;
  if (toStop) { const next = dir > 0 ? stops.find((v) => v > k0 + 0.5) : stops.find((v) => v < k0 - 0.5); kWant = next ?? (dir > 0 ? M.KEY.endTurn1 : M.KEY.endOff); }
  else kWant = Math.max(M.KEY.endOff - 4, Math.min(M.KEY.endTurn1 + 4, k0 + 15 * dir));
  lastBeat = "turn";
  run();
}
function keyK() {
  if (seated() && Math.abs(s.key.kappa) > 0.5) { play([S(0.7, turnTo(0))]); return; }
  play(seated() ? keyGo("rest") : keyGo("keyhole"));
}
function keyD() { play(doubleLockSteps()); }
function keyZero() { if (seated()) { takeOver(); kWant = 0; run(); } }

stage.addEventListener("keydown", (e) => {
  const map = {
    ArrowRight: () => squeeze(e.shiftKey ? 5 : 1),
    ArrowLeft: () => pullOpen(e.shiftKey ? 5 : 1),
    End: () => squeeze(M.NPOS),
    Home: () => pullOpen(0, true),
    " ": nextBeat,
    Enter: nextBeat,
    Escape: () => { takeOver(); release(); },
    ArrowUp: () => turnBy(1, e.shiftKey),
    ArrowDown: () => turnBy(-1, e.shiftKey),
    k: keyK, K: keyK, d: keyD, D: keyD, 0: keyZero,
    z: toggleFraming,
    Z: toggleFraming,
    1: () => chapter(1), 2: () => chapter(2), 3: () => chapter(3),
  };
  const act = map[e.key];
  if (!act) return;
  e.preventDefault();
  if (["ArrowRight", "ArrowLeft", "End", "Home"].includes(e.key)) takeOver();
  act();
});
stage.addEventListener("focus", () => { statusEl.textContent = said.status; });
stage.addEventListener("blur", () => { statusEl.textContent = ""; });

// ---- pointer: drag the strand about the hinge (E.4). Screen → viewBox → W plane at F z 0 (W z 4.8) → F
const { sinA, cosA, sinE, cosE, k: KK } = cameraOf(P);
function toF(e, zW = 4.8) {
  const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const x = vb.x + ((e.clientX - box.left) / box.width) * vb.width, y = vb.y + ((e.clientY - box.top) / box.height) * vb.height;
  const a = (x - P.origin[0]) / KK, b = ((y - P.origin[1]) / KK + zW * cosE) / sinE;
  const wx = a * sinA + b * cosA, wy = -a * cosA + b * sinA;
  return [wx, -wy];
}
const angleOf = ([x, y]) => (Math.atan2(y, x) * 180) / Math.PI;
function onJaw(p, slackMm) {
  const ring = PARTS.jawRing(s.theta);
  let inside = false, best = Infinity;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) inside = !inside;
    const dx = xi - xj, dy = yi - yj, l2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((p[0] - xj) * dx + (p[1] - yj) * dy) / l2));
    best = Math.min(best, Math.hypot(p[0] - xj - t * dx, p[1] - yj - t * dy));
  }
  return inside || best <= slackMm;
}
let drag = null;
// the key on screen (viewBox px): the segment from the barrel tip to the pin tip and the bow, for hits on the key
function nearKey(e, slackCss) {
  const box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const q = [vb.x + ((e.clientX - box.left) / box.width) * vb.width, vb.y + ((e.clientY - box.top) / box.height) * vb.height];
  const pose = { tip: kp.tip, phi: kp.phi, roll: kp.roll, kappa: 0 };
  const W3 = (p) => [p[0], -p[1], p[2] + D.key.z0];
  const a = iso(W3(KEYP.pointAt(pose, 0)), P), b = iso(W3(KEYP.pointAt(pose, KEYP.LEN)), P), c = iso(W3(KEYP.pointAt(pose, KEYP.RING_S)), P);
  const dx = b[0] - a[0], dy = b[1] - a[1], t = Math.max(0, Math.min(1, ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
  const slack = (slackCss * vb.width) / box.width;
  return Math.hypot(q[0] - a[0] - t * dx, q[1] - a[1] - t * dy) <= slack || Math.hypot(q[0] - c[0], q[1] - c[1]) <= 7.6 * KK + slack;
}
svg.addEventListener("pointerdown", (e) => {
  const p = toF(e);
  const mmPerCss = svg.viewBox.baseVal.width / svg.getBoundingClientRect().width / KK;   // viewBox px per css px, over px per mm
  // key drag (E.4, direct manipulation): seated, within 14 css px of the column or the bow; ψ about the post at the bow height
  if (seated() && nearKey(e, 14)) {
    const q = toF(e, 35.1), psi = angleOf([q[0] - POSTF[0], q[1] - POSTF[1]]);
    drag = { key: true, id: e.pointerId, last: psi, turned: 0, kappa0: s.key.kappa, captured: false };
    stage.dataset.dragging = "";
    return;
  }
  if (stationOf() === "rest" && nearKey(e, 10)) { drag = { tap: true, onKey: true, x: e.clientX, y: e.clientY }; return; }   // a tap on the key lying flat = K
  if (!onJaw(p, 8 * mmPerCss)) { drag = { tap: true, x: e.clientX, y: e.clientY }; return; }
  drag = { id: e.pointerId, a0: angleOf(p), last: angleOf(p), turned: 0, theta0: s.theta, captured: false };
  stage.dataset.dragging = "";
});
svg.addEventListener("pointermove", (e) => {
  if (!drag || drag.tap) return;
  if (drag.key) {
    const q = toF(e, 35.1), psi = angleOf([q[0] - POSTF[0], q[1] - POSTF[1]]);
    let d = psi - drag.last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    drag.last = psi; drag.turned += d;
    if (!drag.captured && Math.abs(drag.turned) >= 1.5) { drag.captured = true; svg.setPointerCapture(drag.id); takeOver(); kMode = "pointer"; kCmd = s.key.kappa; }
    if (!drag.captured) return;
    kWant = Math.max(M.KEY.endOff - 30, Math.min(M.KEY.endTurn1 + 30, drag.kappa0 + drag.turned));   // the model stops the flag; it lags the pointer
    lastBeat = "turn";
    run();
    return;
  }
  const a = angleOf(toF(e));
  let d = a - drag.last;
  if (d > 180) d -= 360; else if (d < -180) d += 360;
  drag.last = a; drag.turned += d;
  if (!drag.captured && Math.abs(drag.turned) >= 1.5) { drag.captured = true; svg.setPointerCapture(drag.id); takeOver(); }
  if (!drag.captured) return;
  cmd.mode = "pointer"; pull = null;
  want = Math.max(M.THETA_OPEN - 2, Math.min(M.thetaOf(M.NPOS) + 3, drag.theta0 + drag.turned));
  lastBeat = "drag";
  run();
});
function endDrag(e) {
  if (!drag) return;
  if (drag.tap) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) { if (drag.onKey) keyK(); else nextBeat(); } }
  else if (drag.key) { if (drag.captured && svg.hasPointerCapture(drag.id)) svg.releasePointerCapture(drag.id); kWant = s.key.kappa; kMode = "direct"; run(); }
  else { if (drag.captured && svg.hasPointerCapture(drag.id)) svg.releasePointerCapture(drag.id); want = s.theta; cmd.x = s.theta; cmd.v = 0; run(); }
  drag = null;
  delete stage.dataset.dragging;
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

// hover pauses the tour at the next step boundary (E.4)
stage.addEventListener("pointerenter", () => { hoverPause = true; });
stage.addEventListener("pointerleave", () => { hoverPause = false; run(); });
// reduced motion (E.7): no tour; at load the still: position 9, u 0, key seated at κ −80 (teeth up 1.43), pawl lit, pair framing
if (still.matches) {
  want = M.thetaOf(9); cmd.x = want;
  M.step(s, { jaw: want }, 2);
  kp.tip = SEATED.slice(); kp.phi = 0; kp.roll = 0;
  M.step(s, { key: { at: "keyhole", depth: 1 } }, 1 / 60);
  kWant = -80;
  M.step(s, { jaw: want, key: { at: "keyhole", depth: 1, kappa: -80 } }, 2);
  fall.x = s.alpha; alphaShown = s.alpha;
  draw(true); drawKey(); held.until = -1; say();
}

}
