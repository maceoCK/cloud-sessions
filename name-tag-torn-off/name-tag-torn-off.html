.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}

.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

</style></head><body class="iso" data-theme="dark"><main class="iso-page"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 4A</span><span class="iso-plate-corner" data-corner="title">Name tag, torn off</span><span class="iso-plate-corner" data-corner="hint">Drag across to peel</span><span class="iso-plate-corner" data-corner="readout" data-readout>stuck · name on</span></div><div class="iso-stage nt-stage" tabindex="0" role="slider" aria-label="Name tag peel: drag across or use the arrow keys to peel the sticker; Space tears it off or lays a new one" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Stuck down, the scribble on it"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg nt-svg" viewBox="0 0 600 470" role="img" aria-label="A section of grey brick wall. Stuck straight onto the bricks, across a mortar joint, is a classic red HELLO my name is sticker, 86 by 59 millimetres, with an illegible marker scribble in its white panel. A corner lifts and the sticker rolls up into one curl, adhesive side out; it tears unevenly, so about three fifths come away and fall while a ragged piece with the end of the scribble stays stuck. Where it came off, the bricks hold a stain of adhesive and paper fibre with rows of bare spots, and the joints between them are clean."><style>/* Fig 4A tokens: nearly monochrome, warm greys only. Light first; the dark set follows so a dark

.iso {
  --nt-brick-a: #c9c8c4; --nt-brick-b: #c1c0bc; --nt-brick-c: #cfceca; --nt-brick-d: #bab9b5; --nt-brick-e: #c6c5c1;
  --nt-brick-top: #dddcd8; --nt-brick-end: #b0afab;
  --nt-pit: #8a8985; --nt-fleck: #f1f1ee; --nt-grit: #a7a6a2;
  --nt-mortar: #e9e8e4; --nt-mortar-top: #f0efec; --nt-mortar-end: #d6d5d1;
  --nt-sand: #a2a19c; --nt-sand-light: #f7f7f4;
  --nt-chip: #bebdb9; --nt-screw: #dcdcd9;
  --nt-face-0: #e0e0dd; --nt-face-1: #efefec; --nt-face-2: #ffffff; --nt-face-3: #ffffff; --nt-face-4: #ffffff;
  --nt-back-0: #cbcac6; --nt-back-1: #d7d6d2; --nt-back-2: #e1e0dc; --nt-back-3: #e8e7e4; --nt-back-4: #eeedea; --nt-gloss: #ffffff;
  --nt-ink: #17171b; --nt-ghost: 18%; --nt-edge: var(--anatomy-lit);
  --nt-red-0: #a3242a; --nt-red-1: #bd282e; --nt-red-2: #d42d33; --nt-red-3: #da3238; --nt-red-4: #df383d; --nt-red-ghost: 14%;
  --nt-film: #f2f2ef; --nt-film-o: .62; --nt-island: #fbfbf9; --nt-speck: #55544f;
  --nt-delam: #f0efec; --nt-tear: #8a8986; --nt-fuzzfibre: #fbfbf9;
  --nt-emboss-dk: #8e8d89; --nt-emboss-lt: #ffffff;
  --nt-halo: #575754;
  --nt-flash: #2b2b29; --nt-flash-o: .2; --nt-bloom: #fbfbf9; --nt-bloom-o: .5;
  --nt-grime: #555553; --nt-plug: #cfcfcc; --nt-plughole: #42423f; --nt-ooze: #8c8b87;
  --nt-clay-o: .32; --nt-sand-o: .7; --nt-sandlight-o: .8; --nt-fuzz-o: .62; --nt-drift-o: .42; --nt-paper-o: .13; --nt-press-o: .38;
}
.iso[data-theme="dark"] {
  --nt-brick-a: #2e2e2d; --nt-brick-b: #333332; --nt-brick-c: #2a2a29; --nt-brick-d: #373736; --nt-brick-e: #2c2c2b;
  --nt-brick-top: #3d3d3c; --nt-brick-end: #1f1f1e;
  --nt-pit: #0e0e0e; --nt-fleck: #434342; --nt-grit: #191919;
  --nt-mortar: #3a3a39; --nt-mortar-top: #434342; --nt-mortar-end: #2b2b2a;
  --nt-sand: #1c1c1b; --nt-sand-light: #525250;
  --nt-chip: #1b1b1a; --nt-screw: #2a2a29;
  --nt-face-0: #8d8c88; --nt-face-1: #a5a4a0; --nt-face-2: #bcbbb7; --nt-face-3: #c7c6c2; --nt-face-4: #d0cfcb;
  --nt-back-0: #6a6966; --nt-back-1: #787774; --nt-back-2: #858481; --nt-back-3: #908f8c; --nt-back-4: #9a9996; --nt-gloss: #e3e2df;
  --nt-ink: #151517; --nt-ghost: 20%; --nt-edge: #0b0b0b;
  --nt-red-0: #6a1d21; --nt-red-1: #7c2226; --nt-red-2: #8e272b; --nt-red-3: #962a2e; --nt-red-4: #9d2e32; --nt-red-ghost: 14%;
  --nt-film: #6a6a67; --nt-film-o: .45; --nt-island: #9a9995; --nt-speck: #0a0a0a;

  --nt-clay-o: .7; --nt-sand-o: .9; --nt-sandlight-o: .18; --nt-fuzz-o: .34; --nt-drift-o: .55; --nt-paper-o: .16; --nt-press-o: .35;
}

/* the wall */
[data-part="brick"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-a); }
[data-part="brick"][data-tint="b"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-b); }
[data-part="brick"][data-tint="c"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-c); }
[data-part="brick"][data-tint="d"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-d); }
[data-part="brick"][data-tint="e"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-e); }
.nt-mortar { fill: var(--nt-mortar); stroke: none; }
.nt-flash { stroke: none; }
.nt-flash-0 { stop-color: var(--nt-flash); stop-opacity: var(--nt-flash-o); }
.nt-flash-1 { stop-color: var(--nt-flash); stop-opacity: 0; }
.nt-bloom { fill: var(--nt-bloom); stroke: none; opacity: var(--nt-bloom-o); filter: blur(5px); }
.nt-bloomgrain { stroke: none; opacity: .9; filter: blur(.6px); }
.nt-crack { fill: none; stroke: var(--nt-plughole); stroke-width: .4px; opacity: .45; stroke-linejoin: round; stroke-linecap: round; }
.nt-jointshade { fill: var(--nt-halo); opacity: .16; filter: blur(1.2px); stroke: none; }
.nt-plug { fill: var(--nt-plug); stroke: var(--anatomy-lo); stroke-width: .4px; }
.nt-plughole { fill: var(--nt-plughole); stroke: none; }
.nt-plugscrew { fill: var(--nt-screw); stroke: var(--anatomy-mid); stroke-width: .4px; }
.nt-lift { fill: none; stroke: var(--nt-halo); stroke-width: 1.4px; opacity: .22; filter: blur(.8px); stroke-linecap: round; }
.nt-crop { stroke: none; }
.nt-crop-0 { stop-color: var(--anatomy-card); stop-opacity: 0; }
.nt-crop-1 { stop-color: var(--anatomy-card); stop-opacity: .35; }
.nt-crop-2 { stop-color: var(--anatomy-card); stop-opacity: .85; }
.nt-crop-3 { stop-color: var(--anatomy-card); stop-opacity: 1; }
[data-part="brick"] > .iso-top { fill: var(--nt-brick-top); }
[data-part="brick"] > .iso-shade[data-shade="0"] { fill: var(--nt-brick-end); }
[data-part="mortar"] > .iso-shade[data-shade="2"] { fill: var(--nt-mortar); }
[data-part="mortar"] > .iso-top { fill: var(--nt-mortar-top); }
[data-part="mortar"] > .iso-shade[data-shade="0"] { fill: var(--nt-mortar-end); }
.nt-tex { stroke: none; }
.nt-rx-clay { opacity: var(--nt-clay-o); }
.nt-rx-sand { opacity: var(--nt-sand-o); }
.nt-rx-sandlight { opacity: var(--nt-sandlight-o); }
.nt-rx-fuzz { opacity: var(--nt-fuzz-o); }
.nt-rx-drift { opacity: var(--nt-drift-o); }
.nt-rx-paper { opacity: var(--nt-paper-o); }
.nt-tx-pit { fill: var(--nt-pit); opacity: .55; }
.nt-tx-fleck { fill: var(--nt-fleck); opacity: .9; }
.nt-tx-grit { fill: var(--nt-grit); opacity: .5; }
.nt-tx-sand { fill: var(--nt-sand); opacity: .55; }
.nt-tx-sandlight { fill: var(--nt-sand-light); opacity: .8; }
.nt-chip { fill: var(--nt-chip); stroke: var(--anatomy-lo); stroke-width: .5px; stroke-linejoin: round; }

/* residue */
.nt-ooze { fill: none; stroke: var(--nt-ooze); stroke-width: 1.3px; opacity: .3; filter: blur(.5px); stroke-linejoin: round; }
.nt-ooze-top { stroke-width: 2px; opacity: .35; stroke-linecap: round; }
.nt-film { fill: var(--nt-film); stroke: none; opacity: var(--nt-film-o); }
.nt-islands path { fill: var(--nt-island); stroke: var(--nt-tear); stroke-width: .3px; stroke-linejoin: round; opacity: .92; }
.nt-specks circle { fill: var(--nt-speck); opacity: .55; }

/* the label */
.nt-flat, .nt-stuck { --nt-paper: var(--nt-face-2); --nt-print: var(--nt-red-2); }
:is(.nt-flat, .nt-stuck)[data-band="0"] { --nt-print: var(--nt-red-0); }
:is(.nt-flat, .nt-stuck)[data-band="1"] { --nt-print: var(--nt-red-1); }
:is(.nt-flat, .nt-stuck)[data-band="3"] { --nt-print: var(--nt-red-3); }
:is(.nt-flat, .nt-stuck)[data-band="4"] { --nt-print: var(--nt-red-4); }
:is(.nt-flat, .nt-stuck)[data-band="0"] { --nt-paper: var(--nt-face-0); }
:is(.nt-flat, .nt-stuck)[data-band="1"] { --nt-paper: var(--nt-face-1); }
:is(.nt-flat, .nt-stuck)[data-band="3"] { --nt-paper: var(--nt-face-3); }
:is(.nt-flat, .nt-stuck)[data-band="4"] { --nt-paper: var(--nt-face-4); }
/* the curl shades smoothly: each strip mixes the tone of its band with the next by --f */
.nt-slot { --f: 0%; --g: 0%; --nt-paper: var(--nt-face-2); --nt-print: var(--nt-red-2); }
/* the print shades with the paper; from the back it shows through faintly */
.nt-slot[data-side="face"][data-band="0"] { --nt-print: color-mix(in srgb, var(--nt-red-1) var(--f), var(--nt-red-0)); }
.nt-slot[data-side="face"][data-band="1"] { --nt-print: color-mix(in srgb, var(--nt-red-2) var(--f), var(--nt-red-1)); }
.nt-slot[data-side="face"][data-band="2"] { --nt-print: color-mix(in srgb, var(--nt-red-3) var(--f), var(--nt-red-2)); }
.nt-slot[data-side="face"][data-band="3"] { --nt-print: color-mix(in srgb, var(--nt-red-4) var(--f), var(--nt-red-3)); }
.nt-slot[data-side="face"][data-band="4"] { --nt-print: var(--nt-red-4); }
.nt-slot[data-side="back"] { --nt-print: color-mix(in srgb, var(--nt-red-2) var(--nt-red-ghost), var(--nt-paper)); }
.nt-slot[data-side="face"][data-band="0"] { --nt-paper: color-mix(in srgb, var(--nt-face-1) var(--f), var(--nt-face-0)); }
.nt-slot[data-side="face"][data-band="1"] { --nt-paper: color-mix(in srgb, var(--nt-face-2) var(--f), var(--nt-face-1)); }
.nt-slot[data-side="face"][data-band="2"] { --nt-paper: color-mix(in srgb, var(--nt-face-3) var(--f), var(--nt-face-2)); }
.nt-slot[data-side="face"][data-band="3"] { --nt-paper: color-mix(in srgb, var(--nt-face-4) var(--f), var(--nt-face-3)); }
.nt-slot[data-side="face"][data-band="4"] { --nt-paper: var(--nt-face-4); }
.nt-slot[data-side="back"][data-band="0"] { --nt-paper: color-mix(in srgb, var(--nt-gloss) var(--g), color-mix(in srgb, var(--nt-back-1) var(--f), var(--nt-back-0))); }
.nt-slot[data-side="back"][data-band="1"] { --nt-paper: color-mix(in srgb, var(--nt-gloss) var(--g), color-mix(in srgb, var(--nt-back-2) var(--f), var(--nt-back-1))); }
.nt-slot[data-side="back"][data-band="2"] { --nt-paper: color-mix(in srgb, var(--nt-gloss) var(--g), color-mix(in srgb, var(--nt-back-3) var(--f), var(--nt-back-2))); }
.nt-slot[data-side="back"][data-band="3"] { --nt-paper: color-mix(in srgb, var(--nt-gloss) var(--g), color-mix(in srgb, var(--nt-back-4) var(--f), var(--nt-back-3))); }
.nt-slot[data-side="back"][data-band="4"] { --nt-paper: color-mix(in srgb, var(--nt-gloss) var(--g), var(--nt-back-4)); }
.nt-face, .nt-strip { fill: var(--nt-paper); stroke: none; }
.nt-print { fill: var(--nt-print); stroke: none; }
/* hairlines over the print's joints, wider than the paper's seam so none of it shows through */
.nt-printseam { fill: none; stroke: var(--nt-print); stroke-width: 1.5px; stroke-linecap: butt; }
.nt-knock { fill: var(--nt-paper); stroke: none; }
.nt-knockseam { fill: none; stroke: var(--nt-paper); stroke-width: 2px; stroke-linecap: butt; }
.nt-nameis { fill: none; stroke: var(--nt-paper); stroke-width: calc(var(--nt-name-w) * var(--w, 1)); stroke-linecap: round; stroke-linejoin: round; }
.nt-seam { fill: none; stroke: var(--nt-paper); stroke-width: .8px; stroke-linecap: round; }
.nt-seamgrain { fill: none; stroke-width: .8px; stroke-linecap: round; }
.nt-under { fill: var(--anatomy-paper); stroke: none; }
/* pressed onto the bricks: their grain shows through, and the joints show as a dip; --k fades both
   while a new label is still held off the wall */
.nt-press { opacity: calc(var(--nt-press-o) * var(--k, 1)); }
.nt-emboss { fill: none; stroke-linecap: round; }
.nt-emboss[data-tone="dk"] { stroke: var(--nt-emboss-dk); stroke-width: 1.5px; opacity: calc(.45 * var(--k, 1)); filter: blur(.6px); }
.nt-emboss[data-tone="lt"] { stroke: var(--nt-emboss-lt); stroke-width: 1px; opacity: calc(.45 * var(--k, 1)); filter: blur(.35px); }
.nt-side { stroke: none; }
.nt-side[data-shade="0"] { fill: var(--nt-face-0); }
.nt-side[data-shade="1"] { fill: var(--nt-face-1); }
.nt-side[data-shade="2"] { fill: var(--nt-face-1); }
.nt-side[data-shade="3"] { fill: var(--nt-face-2); }
.nt-delam { fill: var(--nt-delam); stroke: none; }
.nt-halo { fill: var(--nt-halo); stroke: none; }
.nt-contact { filter: blur(1.4px); }
.nt-edge { fill: none; stroke: var(--nt-edge); stroke-width: .7px; stroke-linecap: round; stroke-linejoin: round; }
.nt-crease { fill: none; stroke: color-mix(in srgb, var(--nt-tear) 55%, var(--nt-paper)); stroke-width: .55px; stroke-linecap: round; }
.nt-tear { fill: none; stroke: var(--nt-tear); stroke-width: .6px; stroke-linecap: round; stroke-linejoin: round; }
.nt-ink { fill: none; stroke: var(--nt-ink); stroke-linecap: round; stroke-linejoin: round; }
/* marker feathers a little into the paper's fibre */
.nt-bleed { fill: none; stroke: var(--nt-ink); stroke-width: 3.4px; opacity: .1; stroke-linecap: round; stroke-linejoin: round; filter: blur(.5px); }
.nt-ghost { fill: none; stroke: color-mix(in srgb, var(--nt-ink) var(--nt-ghost), var(--nt-paper)); stroke-width: 1.3px; stroke-linecap: round; stroke-linejoin: round; }
.nt-backscar { fill: color-mix(in srgb, var(--nt-fuzzfibre) 60%, var(--nt-paper)); stroke: color-mix(in srgb, var(--nt-tear) 45%, var(--nt-paper)); stroke-width: .3px; stroke-linejoin: round; }
.nt-backspot { fill: color-mix(in srgb, var(--nt-tear) 32%, var(--nt-paper)); stroke: none; }
.nt-backfuzz { fill: none; stroke: color-mix(in srgb, var(--nt-fuzzfibre) 70%, var(--nt-paper)); stroke-width: .7px; stroke-linecap: round; }
.nt-fringe { fill: none; stroke: color-mix(in srgb, var(--nt-fuzzfibre) 80%, var(--nt-paper)); stroke-width: 2.2px; stroke-linecap: round; stroke-linejoin: round; }
.nt-slot[data-empty] { display: none; }
.nt-stage { touch-action: pan-y; cursor: ew-resize; outline: none; }
.nt-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
@media (max-width: 560px) { .nt-stage { overflow: hidden; margin-inline: -12px; } .nt-stage .iso-svg { width: 118%; max-width: none; margin-left: -9%; } }
.nt-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

an></figcaption></figure></main><script type="module">// A blank name sticker torn off a brick wall: one curl that comes away, a ragged

// name lives inside PEEL and nothing clashes with anything else on the page.

      let run = [];
      for (let i = 0; i <= n; i++) {
        const p = [a[0] + ((b[0] - a[0]) * i) / n, a[1] + ((b[1] - a[1]) * i) / n];
        if (inside(poly, p)) run.push(p);
        else if (run.length) (out.push(run), (run = []));
      }
      if (run.length) out.push(run);
      return out.filter((r) => r.length > 1).map((r) => [r[0], r[r.length - 1]]);
    };
    const xa = CENTRE[0] - TAG.w, xb = CENTRE[0] + TAG.w, za = CENTRE[1] - TAG.h, zb = CENTRE[1] + TAG.h;
    const dk = [], lt = [];
    for (let c = Math.floor(za / COURSE) - 1; c * COURSE < zb; c++) {
      // the bed joint above course c: its lower edge is the brick's top, its upper edge the next course
      const top = c * COURSE + BRICK.h, next = (c + 1) * COURSE;
      lt.push(...clip(inner, toUVw([xa, top]), toUVw([xb, top])));
      dk.push(...clip(inner, toUVw([xa, next]), toUVw([xb, next])));
      for (const [b0, b1, z0, z1] of bricksOf(c, xa, xb)) {
        // the head joint to the right of this brick
        dk.push(...clip(inner, toUVw([b1, z0]), toUVw([b1, z1])));
        lt.push(...clip(inner, toUVw([b1 + JOINT, z0]), toUVw([b1 + JOINT, z1])));
      }
    }
    const onStuck = (runs) => runs.flatMap(([a, b]) => clip(STUCK, a, b));
    return { dk, lt, dkDW: dk.map((r) => r.map(toDW)), ltDW: lt.map((r) => r.map(toDW)), stuckDk: onStuck(dk), stuckLt: onStuck(lt) };
  })();

  // Polylines on the label, cut where they cross strip boundaries, mapped, keyed by strip (-1 for
  // the flat part). `keep` picks which keys a set of strokes may land in.
  function runsOf(frame, sets) {
    const { sheet, C } = frame;
    const st = sheet.st;
    const cuts = frame.cuts;
    const stripOf = (d) => {
      if (d >= st.f) return -1;
      let lo = 0, hi = cuts.length - 1;
      while (hi - lo > 1) {
        const m = (lo + hi) >> 1;
        if (cuts[m] > d) lo = m;
        else hi = m;
      }
      return lo;
    };
    const runs = new Map();
    const bounds = cuts.length ? cuts : [st.f];
    for (const [strokes, keep] of sets) {
      const push = (key, pts) => {
        if (pts.length < 2 || !keep(key)) return;
        if (!runs.has(key)) runs.set(key, []);
        runs.get(key).push(pts.map((p) => project(C, sheet.at(p[0], p[1]))));
      };
      for (const stroke of strokes) {
        let run = [stroke[0]];
        let key = stripOf(stroke[0][0]);
        let keyA = key;
        for (let i = 1; i < stroke.length; i++) {
          const a = stroke[i - 1], b = stroke[i];
          const keyB = stripOf(b[0]);
          if (keyB === keyA) {
            run.push(b);
            continue;
          }
          keyA = keyB;
          const lo = Math.min(a[0], b[0]), hi = Math.max(a[0], b[0]);
          const ts = bounds.filter((c) => c > lo && c < hi).map((c) => (c - a[0]) / (b[0] - a[0])).sort((x, y) => x - y);
          for (const t of ts) {
            const p = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
            run.push(p);
            push(key, run);
            key = stripOf(a[0] + (b[0] - a[0]) * Math.min(1, t + 1e-4));
            run = [p];
          }
          run.push(b);
        }
        push(key, run);
      }
    }
    return runs;
  }
  // Ink: ahead of the front all of it is flat, on both sides of the tear-to-be; behind it only the
  // flap's ink moves, and the rest is drawn once, on the piece that stayed.
  function inkOf(frame) {
    const st = frame.sheet.st;
    const sets = [];
    if (frame.flat) sets.push([INK.all, (key) => key === -1]);
    if (st.f > D_MIN) sets.push([INK.flap, (key) => key >= 0]);
    return runsOf(frame, sets);
  }

  // ---- Residue ---------------------------------------------------------------------------------------
  // Where the flap was: the adhesive split, so a fuzz of paper fibre lies in it; the front stuck and
  // slipped, leaving rows of bare spots across it; clean patches where it let go; white islands of
  // paper where it held hardest, by the corner that was picked; a fingernail's scrapes. In (u, v).
  const RESIDUE = (() => {
    const R = rng(9203);
    const blob = (cx, cy, r, k, jag = 0.3, stretch = [1, 1], turn = 0) => {
      const out = [];
      const ph = R() * 6;
      for (let i = 0; i < k; i++) {
        const a = (i / k) * Math.PI * 2;
        const rr = r * (1 + jag * (Math.sin(a * 3 + ph) * 0.5 + (R() - 0.5)));
        const x = Math.cos(a) * rr * stretch[0], y = Math.sin(a) * rr * stretch[1];
        out.push([cx + x * Math.cos(turn) - y * Math.sin(turn), cy + x * Math.sin(turn) + y * Math.cos(turn)]);
      }
      return out;
    };
    const inFlap = (p) => inside(FLAP, p);
    const along = Math.atan2(W2[1], W2[0]);
    const stops = [];
    for (let d = D_MIN + 22; d < D_END - 6; d += 10 + R() * 8) stops.push(d);
    const tornEdge = (base, depth, amp) => {
      let pts = base;
      for (let level = 0; level < depth; level++, amp *= 0.5) {
        const next = [];
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          const dx = b[0] - a[0], dy = b[1] - a[1];
          const len = Math.hypot(dx, dy) || 1;
          const t = 0.35 + R() * 0.3, off = (R() - 0.5) * 2 * amp;
          next.push(a, [a[0] + dx * t - (dy / len) * off, a[1] + dy * t + (dx / len) * off]);
        }
        pts = next;
      }
      return pts;
    };
    // Rows of bare spots along each stop: small ragged holes, some running together.
    const holes = [];
    const ragged = (cx, cy, r, n, stretch, turn) => {
      const pts = [];
      const ph = R() * 6;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const rr = r * (0.62 + 0.25 * Math.sin(a * 2 + ph) + 0.35 * R());
        const x = Math.cos(a) * rr * stretch[0], y = Math.sin(a) * rr * stretch[1];
        pts.push([cx + x * Math.cos(turn) - y * Math.sin(turn), cy + x * Math.sin(turn) + y * Math.cos(turn)]);
      }
      return r > 0.6 ? tornEdge(pts, 1, r * 0.22) : pts;
    };
    for (const d of stops) {
      let w = W_MIN + R() * 4;
      while (w < W_MAX) {
        const run = R() < 0.2 ? 0 : 1;
        const r = 0.7 + R() ** 1.5 * 2.2;
        const [u, v] = toUV([d + (R() - 0.5) * 1.2, w]);
        if (run && inFlap([u, v])) holes.push(ragged(u, v, r, 11, [1.35, 0.7], along + (R() - 0.5) * 0.5));
        w += r * 1.8 + R() * 3.5;
      }
    }
    // Pinholes all over, and a few larger clean patches toward the end of the peel.
    for (let i = 0; i < 70; i++) {
      const p = [(R() - 0.5) * TAG.w, (R() - 0.5) * TAG.h];
      if (inFlap(p)) holes.push(ragged(p[0], p[1], 0.35 + R() * 0.55, 7, [1, 1], R() * 3));
    }
    for (let i = 0; i < 9; i++) {
      const [u, v] = toUV([mix(D_MIN + 50, D_END - 6, Math.sqrt(R())), mix(W_MIN, W_MAX, R())]);
      if (inFlap([u, v])) holes.push(ragged(u, v, 2 + R() * 3, 16, [1.5, 0.8], R() * Math.PI));
    }
    const corner = toUV(FLAP_DW.reduce((best, q) => (q[0] < best[0] ? q : best)));
    // Paper the adhesive kept: torn scraps, most near the corner that was picked. Each is a lumpy
    // oval, longer along the front, its edge broken up at three scales the way paper tears.
    const islands = [];
    for (let i = 0; i < 13; i++) {
      const near = i < 8;
      const [u, v] = near ? [corner[0] + 7 + R() * 24, corner[1] + 6 + R() * 18] : toUV([mix(D_MIN + 20, D_END, R()), mix(W_MIN, W_MAX, R())]);
      if (!inFlap([u, v])) continue;
      const r = near ? 1.4 + R() * 3.2 : 0.7 + R() * 1.4;
      const turn = along + (R() - 0.5) * 0.9;
      const k = 6 + Math.floor(R() * 3);
      const base = [];
      for (let j = 0; j < k; j++) {
        const a = (j / k) * Math.PI * 2 + (R() - 0.5) * 0.5;
        const rr = r * (0.75 + 0.45 * R());
        const x = Math.cos(a) * rr * 1.45, y = Math.sin(a) * rr * 0.75;
        base.push([u + x * Math.cos(turn) - y * Math.sin(turn), v + x * Math.sin(turn) + y * Math.cos(turn)]);
      }
      islands.push(tornEdge(base, 3, r * 0.32));
    }
    const scratches = [];
    for (let i = 0; i < 7; i++) {
      const [u, v] = [corner[0] + 8 + R() * 30, corner[1] + 4 + R() * 26];
      const len = 8 + R() * 20, a = -0.5 + (R() - 0.5) * 0.25;
      const half = 0.22 + R() * 0.18;
      const pts = [];
      for (let k = 0; k <= 10; k++) pts.push([u + Math.cos(a) * len * (k / 10), v + Math.sin(a) * len * (k / 10), half * Math.sin((Math.PI * k) / 10)]);
      scratches.push([...pts.map(([x, y, h]) => [x - Math.sin(a) * h, y + Math.cos(a) * h]), ...pts.map(([x, y, h]) => [x + Math.sin(a) * h, y - Math.cos(a) * h]).reverse()]);
    }
    const specks = [];
    for (let i = 0; i < 90; i++) {
      const p = [(R() - 0.5) * TAG.w, (R() - 0.5) * TAG.h];
      if (inFlap(p)) specks.push([...p, 0.2 + R() * 0.32]);
    }
    return { stops, holes, islands, scratches, specks };
  })();

  // The piece that stayed: along its torn edge the top paper split away and left the fibrous under
  // layer showing, a pale ragged band; loose fibres stand out past the tear.
  const STUCK_EDGE = (() => {
    const R = rng(5507);
    let w = 0;
    const inner = TEAR.map(([u, v], i) => {
      w = w * 0.75 + (R() - 0.2) * 1.5;
      return [u + clamp(1.4 + 2.6 * (0.5 + 0.5 * Math.sin(i * 0.21 + 0.7)) + w, 0.6, 6.5), v];
    });
    const fibres = [];
    for (let i = 2; i < TEAR.length - 2; i++) {
      if (R() < 0.45) continue;
      const [u, v] = TEAR[i];
      const len = 0.8 + R() * 2.4;
      const a = Math.PI + (R() - 0.5) * 1.2;
      fibres.push([[u + 0.2, v], [u + Math.cos(a) * len, v + Math.sin(a) * len]]);
    }
    return { band: [...TEAR, ...[...inner].reverse()], inner, fibres };
  })();

  // The flap's own torn edge: the top layer of paper tore a little beyond the layer under it, so
  // on the flap's back a pale ragged fringe runs along the tear. A line just inside it, in (d, w).
  const FRINGE = (() => {
    const R = rng(4402);
    let w = 0;
    const line = TEAR.slice(1, -1).map(([u, v]) => {
      w = w * 0.7 + (R() - 0.5) * 0.9;
      return toDW([u - 1.5 - Math.abs(w), v]);
    });
    return [line.filter((p) => inside(FLAP_DW, p))];
  })();

  // Loose fibres standing out past the flap's torn edge, as on the piece that stayed, in (d, w).
  const FLAP_FIBRES = (() => {
    const R = rng(6619);
    const out = [];
    for (let i = 2; i < TEAR.length - 2; i++) {
      if (R() < 0.5) continue;
      const [u, v] = TEAR[i];
      const len = 0.7 + R() * 2.2;
      const a = (R() - 0.5) * 1.3;
      out.push([toDW([u - 0.3, v]), toDW([u + Math.cos(a) * len, v + Math.sin(a) * len])]);
    }
    return out;
  })();

  // Fibre the brick did not keep, left on the flap's adhesive side: specks and short fibres in
  // (d, w), drawn wherever the back of the flap faces the viewer, so they move with the paper.
  const BACK_FUZZ = (() => {
    const R = rng(8821);
    const out = [];
    while (out.length < 300) {
      const p = [(R() - 0.5) * TAG.w, (R() - 0.5) * TAG.h];
      if (!inside(FLAP, p)) continue;
      const [d, w] = toDW(p);
      const len = R() < 0.3 ? 1.2 + R() * 2.6 : 0.05;
      const a = R() * Math.PI;
      out.push([[d - (Math.cos(a) * len) / 2, w - (Math.sin(a) * len) / 2], [d + (Math.cos(a) * len) / 2, w + (Math.sin(a) * len) / 2]]);
    }
    return out;
  })();

  // Where the brick shows a bare spot the adhesive went with the paper, so the back of the flap
  // carries the same spots, thick with adhesive: the brick's rows, mirrored onto the curl.
  // Where paper stayed on the brick, the back is torn rough instead: pale, fibrous scars.
  const backOf = (h, n, kind) => {
    const step = h.length / n;
    const pts = Array.from({ length: n }, (_, i) => toDW(h[Math.floor(i * step)]));
    return { pts, kind, mid: pts.reduce((a, p) => a + p[0], 0) / pts.length };
  };
  const BACK_SPOTS = [
    ...RESIDUE.holes.filter((h) => h.length >= 11).map((h) => backOf(h, 8, "spots")),
    ...RESIDUE.islands.map((h) => backOf(h, 24, "scars")),
  ];

  // ---- The numbers -----------------------------------------------------------------------------------
  // Kendall's thin-film peel: F = G·b / (1 − cos θ), b the length of the front still on the flap.
  // A label acrylic on brick holds at about G = 70 J/m² (≈ 0.9 N per 25 mm at 180°): it only wets the
  // high points of the rough face, but it soaks into them, so the paper tears before it lets go.
  const G_ADHESIVE = 70;
  function forceAt(st) {
    const b = st.chord / MM / 1000;
    const c = 1 - Math.cos(Math.max(st.theta, 1 * RAD));
    return st.f >= D_END || st.f <= D_MIN + 0.01 ? 0 : (G_ADHESIVE * b) / c;
  }
  const SHARE_OFF = FLAP_AREA / TAG_AREA;

  // Stick-slip timing: the front lingers at each row of bare spots and jumps between them.
  let slipTable = null;
  function slipAt(t) {
    if (!slipTable) {
      const n = 400;
      const f0 = D_MIN + LIFT_D, f1 = D_END;
      const fs = [], ts = [0];
      for (let i = 0; i <= n; i++) fs.push(f0 + ((f1 - f0) * i) / n);
      const dwell = (f) => 1 + 2.2 * RESIDUE.stops.reduce((sum, c) => sum + Math.exp(-(((f - c) / 1.6) ** 2)), 0);
      for (let i = 1; i <= n; i++) ts.push(ts[i - 1] + dwell((fs[i] + fs[i - 1]) / 2) * (fs[i] - fs[i - 1]));
      slipTable = { fs, ts, n, total: ts[n] };
    }
    const { fs, ts, n, total } = slipTable;
    const want = clamp(t, 0, 1) * total;
    let lo = 1, hi = n;
    while (lo < hi) {
      const m = (lo + hi) >> 1;
      if (ts[m] < want) lo = m + 1;
      else hi = m;
    }
    const i = Math.max(1, lo);
    const u = (want - ts[i - 1]) / (ts[i] - ts[i - 1] || 1);
    return fs[i - 1] + (fs[i] - fs[i - 1]) * clamp(u, 0, 1);
  }

  // ---- Paint ------------------------------------------------------------------------------------------
  const fmt = (v) => {
    let n = Math.round(v * 10);
    if (n === 0) return "0";
    const neg = n < 0;
    if (neg) n = -n;
    const i = (n / 10) | 0, d = n - i * 10;
    return (neg ? "-" : "") + i + (d ? "." + d : "");
  };
  const pathOf = (pts, closed = false) => {
    if (!pts.length) return "";
    let d = "M" + fmt(pts[0][0]) + " " + fmt(pts[0][1]);
    for (let i = 1; i < pts.length; i++) d += "L" + fmt(pts[i][0]) + " " + fmt(pts[i][1]);
    return closed ? d + "Z" : d;
  };
  function hull2(points) {
    const p = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (p.length < 3) return p;
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) {
      while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop();
      lo.push(q);
    }
    for (let i = p.length - 1; i >= 0; i--) {
      const q = p[i];
      while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop();
      up.push(q);
    }
    return [...lo.slice(0, -1), ...up.slice(0, -1)];
  }
  // Runs of consecutive polygon edges that pass `want`, as point lists.
  function edgeRuns(scr, kinds, want) {
    const n = scr.length;
    const flags = kinds.map(want);
    const runs = [];
    const start = flags.findIndex((f, i) => f && !flags[(i + n - 1) % n]);
    if (start < 0) return flags.every(Boolean) ? [[...scr, scr[0]]] : [];
    let run = null;
    for (let k = 0; k < n; k++) {
      const i = (start + k) % n;
      if (flags[i]) {
        if (!run) run = [scr[i]];
        run.push(scr[(i + 1) % n]);
      } else if (run) {
        runs.push(run);
        run = null;
      }
    }
    if (run) runs.push(run);
    return runs;
  }

  // A flat piece of label on the wall: its face, the thin paper edge on the sides that face the
  // viewer, its die-cut outline and its torn edge. `flat2` are its points in a plane basis whose
  // directions `dir2` maps to the world; `nrm` is its face normal.
  function slabPaint(C, world, flat2, kinds, dir2, nrm) {
    const n = world.length;
    const sgn = areaOf(flat2) > 0 ? 1 : -1;
    const scr = world.map((p) => project(C, p));
    const below = world.map((p) => project(C, sub(p, mul(nrm, TAG_T))));
    const sides = [[], [], [], []];
    const seen = [];
    for (let i = 0; i < n; i++) {
      const a = flat2[i], b = flat2[(i + 1) % n];
      const ex = b[0] - a[0], ey = b[1] - a[1];
      const l = Math.hypot(ex, ey) || 1;
      const o3 = unit(dir2([(sgn * ey) / l, (-sgn * ex) / l]));
      const sees = kinds[i] !== "cut" && dot(o3, C.V) > 1e-6;
      seen.push(sees);
      if (sees) sides[Math.min(3, bandOf(dot(o3, C.L)))].push(pathOf([scr[i], scr[(i + 1) % n], below[(i + 1) % n], below[i]], true));
    }
    const die = edgeRuns(scr, kinds, (k) => k === "die").map((r) => pathOf(r));
    const tear = edgeRuns(scr, kinds, (k) => k === "tear").map((r) => pathOf(r));
    const lower = edgeRuns(below, kinds.map((k, i) => seen[i] && k === "die"), (k) => k).map((r) => pathOf(r));
    const lowerTear = edgeRuns(below, kinds.map((k, i) => seen[i] && k === "tear"), (k) => k).map((r) => pathOf(r));
    return {
      fill: pathOf(scr, true),
      under: pathOf(scr, true) + pathOf(below, true),
      sides: sides.map((list) => list.join("")),
      band: bandOf(dot(nrm, C.L)),
      edge: [...die, ...lower].join(""),
      tear: [...tear, ...lowerTear].join(""),
      // where the flat part ends at the front, a hairline of its own paper hides the joint
      seam: edgeRuns(scr, kinds, (k) => k === "cut").map((r) => pathOf(r)).join(""),
    };
  }

  const CAST = [0.22, 0, -0.33]; // shadow offset per unit of height: the light is up and to the left
  function paintOf(st, P, { place = 0, coarse = 1 } = {}) {
    const frame = frameOf(st, P, { place, coarse });
    const C = frame.C;
    const ink = inkOf(frame);
    const out = { halo: "", haloOpacity: 0, haloBlur: 3, contact: "", contactOpacity: 0, flat: null, strips: [] };
    // Shadow: everything off the wall, cast back onto it by the light from the upper left. It falls
    // down and to the right: a soft one from the whole curl, and a tight dark one from the paper
    // just leaving the bricks.
    const lifted = [], low = [];
    let heights = 0, count = 0;
    const drop = (p, front = false) => {
      const h = dot(sub(p, FACE0), N);
      const q = project(C, add(sub(p, mul(N, h)), mul(CAST, Math.max(0, h))));
      lifted.push(q);
      if (front && h < 7) low.push(q);
      heights += h;
      count++;
    };
    frame.strips.forEach((strip, i) => {
      if (i % 3 && i !== frame.strips.length - 1 && i > 12) return;
      const front = st.f - strip.hi < 12;
      strip.dw.forEach((p, j) => j % 3 || drop(frame.sheet.at(p[0], p[1]), front));
    });
    if (frame.flat && place > 0) for (const p of frame.flat.pts) drop(p);
    const fade = 1 - smooth(0.2, 0.6, st.off);
    if (lifted.length >= 3) {
      const mean = heights / count;
      out.halo = pathOf(hull2(lifted), true);
      out.haloOpacity = clamp(0.16 + mean / 90, 0.16, 0.36) * (1 - smooth(25, 95, mean)) * fade;
      out.haloBlur = clamp(3 + mean / 4, 3, 14);
    }
    out.contact = "";
    out.contactOpacity = 0;
    if (low.length >= 3 && !st.free && place === 0) {
      out.contact = pathOf(hull2(low), true);
      out.contactOpacity = 0.3 * smooth(0, 0.04, st.s) * fade;
    }
    if (frame.flat) {
      const { pts, kind, dw } = frame.flat;
      const nrm = frame.sheet.poseDir(N);
      out.flat = slabPaint(C, pts, dw, kind, (v) => frame.sheet.poseDir(dwDir(v)), nrm);
      out.flat.ink = (ink.get(-1) || []).map((r) => pathOf(r)).join("");
      const flatPrint = printOn(dw.map((p, i) => ({ p, kind: kind[i] })));
      const toScr = (q) => project(C, frame.sheet.at(q.p[0], q.p[1]));
      out.flat.red = flatPrint.red.map((r) => pathOf(r.map(toScr), true)).join("");

      put(slot.memo, "spots", slot.spots, "d", s.spots);
      put(slot.memo, "scars", slot.scars, "d", s.scars);
      put(slot.memo, "fringe", slot.fringe, "d", s.fringe);
      put(slot.memo, "tear", slot.tear, "d", s.tear);
      put(slot.memo, "crease", slot.crease, "d", s.crease);
      put(slot.memo, "ink", slot.ink, "d", s.ink);
      put(slot.memo, "edge", slot.edge, "d", s.edge);
      if (s.ink) put(slot.memo, "w", slot.ink, "style", `stroke-width:${(inkWidth * s.width).toFixed(1)}px`);
    }
    cost = cost * 0.9 + (performance.now() - t0) * 0.1;
    if (DATA.coarse === null) {
      if (coarse === 1 && cost > 10) coarse = 1.6;
      else if (coarse > 1 && cost < 4) coarse = 1;
    }
  }
  const alpha = state.alpha >= 0.999 ? "" : state.alpha.toFixed(3);
  if (tagG.style.opacity !== alpha) tagG.style.opacity = alpha;
  say(state);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring) {
    clock += dt;
    const t = tourAt(clock);
    target = { s: t.s, place: t.place, alpha: t.alpha };
    state = { ...target };
  } else {
    const k = calm ? 1 : 1 - Math.exp(-dt / 0.2);
    const ka = calm ? 1 : 1 - Math.exp(-dt / 0.3);
    state = {
      s: state.s + (target.s - state.s) * k,
      place: state.place + (target.place - state.place) * k,
      alpha: state.alpha + (target.alpha - state.alpha) * ka,
    };
    if (Math.abs(state.s - target.s) < 1e-4) state.s = target.s;
    if (Math.abs(state.place - target.place) < 0.01) state.place = target.place;
    if (Math.abs(state.alpha - target.alpha) < 0.002) state.alpha = target.alpha;
  }
  draw(!touring && state.s === target.s && state.place === target.place);
  const settled = !touring && state.s === target.s && state.place === target.place && state.alpha === target.alpha;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};

// The reader takes over: the label comes back if the tour had sent it away, and the tour resumes
// a little after the last input, from the start of its cycle.
function steer(next) {
  touring = false;
  const s = clamp(next, 0, S_END);
  target = { s, place: 0, alpha: alphaOf(s) };
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    // Resume from wherever the label is: an unpeeled label starts the cycle, a peeled one goes on.
    touring = true;
    clock = state.s <= 0.001 ? 0 : resumeClock(state.s);
    run();
  }, 3600);
  run();
}
// The tour time at which it shows peel s (for a smooth hand-back).
function resumeClock(s) {
  const t0 = T.rest;
  if (s < LIFT) return t0 + T.lift * inverse((u) => LIFT * ease(u), s);
  if (s <= 1) {
    const t1 = t0 + T.lift;
    return t1 + T.peel * inverse((u) => tourAt(t1 + T.peel * u).s, s);
  }
  return t0 + T.lift + T.peel + T.off * inverse((u) => 1 + OFF * ease(u), s);
}
function inverse(fn, y) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 30; i++) {
    const m = (lo + hi) / 2;
    if (fn(m) < y) lo = m;
    else hi = m;
  }
  return (lo + hi) / 2;
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

// Pointer: across the figure is along the peel. Hover previews, a press drags.
const REACH = [0.18, 0.86];
const sOfPointer = (event) => {
  const box = svg.getBoundingClientRect();
  const x = (event.clientX - box.left) / box.width;
  const share = clamp((x - REACH[0]) / (REACH[1] - REACH[0]), 0, 1);
  return share * (1 + OFF * 0.55);
};
let pressed = false;
stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch" && !pressed) return;
  steer(sOfPointer(event));
});
stage.addEventListener("pointerdown", (event) => {
  pressed = true;
  try { stage.setPointerCapture(event.pointerId); } catch {}
  steer(sOfPointer(event));
});
const release = (event) => {
  pressed = false;
  try { stage.releasePointerCapture(event.pointerId); } catch {}
};
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("pointerleave", () => { if (!pressed) steer(target.s); });
stage.addEventListener("focus", () => { announcer.textContent = WORDS[phaseOf(state)]; });
stage.addEventListener("keydown", (event) => {
  const from = touring ? state.s : target.s;
  const step = event.shiftKey ? 0.2 : 0.05;
  let to = null;
  if (event.key === "ArrowRight" || event.key === "ArrowUp") to = from + step;
  if (event.key === "ArrowLeft" || event.key === "ArrowDown") to = from - step;
  if (event.key === "Home") to = 0;
  if (event.key === "End") to = 1;
  if (event.key === " " || event.key === "Enter") to = from < 0.5 ? 1 + OFF * 0.55 : 0;
  if (event.key === "Escape") {
    clearTimeout(idleTimer);
    touring = !still.matches;
    clock = state.s <= 0.001 ? 0 : resumeClock(state.s);
    run();
    event.preventDefault();
    return;
  }
  if (to === null) return;
  event.preventDefault();
  steer(to);
});

if (still.matches || DATA.hold !== null) {
  touring = false;
  const s = DATA.hold ?? 0.78;
  state = { s, place: 0, alpha: alphaOf(s) };
  target = { ...state };
}
still.addEventListener?.("change", () => {
  if (still.matches) {
    touring = false;
    target = { s: state.s, place: 0, alpha: alphaOf(state.s) };
  }
  run();
});
draw();
</script></body></html>
