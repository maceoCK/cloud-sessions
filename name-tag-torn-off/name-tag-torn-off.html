<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Name tag, torn off</title><style>

}

.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}

.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 4A</span><span class="iso-plate-corner" data-corner="title">Name tag, torn off</span><span class="iso-plate-corner" data-corner="hint">Drag across to peel</span><span class="iso-plate-corner" data-corner="readout" data-readout>stuck · name on</span></div><div class="iso-stage nt-stage" tabindex="0" role="slider" aria-label="Name tag peel: drag across or use the arrow keys to peel the sticker; Space tears it off or lays a new one" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Stuck down, the scribble on it"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg nt-svg" viewBox="0 0 600 470" role="img" aria-label="A section of brick wall with a brushed stainless steel plate screwed to it on four spacers. Stuck to the plate is a blank 86 by 59 millimetre name sticker with an illegible marker scribble. A corner lifts and the sticker rolls up into one curl, adhesive side out; it tears unevenly, so about three fifths come away and fall while a ragged piece with the end of the scribble stays stuck. Where it came off, the plate holds a fuzz of adhesive and paper fibre with rows of bare spots."><style>/* Fig 4A tokens. Light first; the dark set follows so a dark plate on a light page still wins. */
.iso {
  --nt-brick-a: #e5cdbf; --nt-brick-b: #dcc1b1; --nt-brick-c: #e9d6ca; --nt-brick-d: #d6b8a7; --nt-brick-e: #e2d0c6;
  --nt-brick-top: #f1e5dc; --nt-brick-end: #d2baab;
  --nt-pit: #9c8172; --nt-fleck: #f7eee8; --nt-grit: #b89e8f;
  --nt-mortar: #e4e2dc; --nt-mortar-top: #eeece7; --nt-mortar-end: #d3d0c9;
  --nt-sand: #aaa69c; --nt-sand-light: #f7f6f2;
  --nt-chip: #cfb3a3;
  --nt-steel-face: #e8e9e8; --nt-steel-top: #f4f5f4; --nt-steel-end: #d2d3d2; --nt-screw: #dfe0df;
  --nt-face-0: #e0e0dd; --nt-face-1: #efefec; --nt-face-2: #ffffff; --nt-face-3: #ffffff; --nt-face-4: #ffffff;
  --nt-back-0: #ccc9bf; --nt-back-1: #d8d5cc; --nt-back-2: #e2dfd7; --nt-back-3: #e9e6df; --nt-back-4: #eeebe5;
  --nt-ink: #17171b; --nt-ghost: 18%;
  --nt-film: #d6d5ce; --nt-thick: #c9c8bf; --nt-thin: #e2e2dc; --nt-fuzz: #f8f7f2;
  --nt-hole: #e8e9e8; --nt-island: #fbfaf6; --nt-speck: #5f5e57;
  --nt-delam: #f0eee7; --nt-tear: #8c8a84;
  --nt-halo: #5c5b54;
}
.iso[data-theme="dark"] {
  --nt-brick-a: #2a211d; --nt-brick-b: #2e2420; --nt-brick-c: #271f1b; --nt-brick-d: #31251f; --nt-brick-e: #241e1b;
  --nt-brick-top: #352a24; --nt-brick-end: #1d1714;
  --nt-pit: #110c0a; --nt-fleck: #40352e; --nt-grit: #1a1310;
  --nt-mortar: #222120; --nt-mortar-top: #2b2a28; --nt-mortar-end: #181716;
  --nt-sand: #121110; --nt-sand-light: #33322f;
  --nt-chip: #1a1411;
  --nt-steel-face: #1e1f1f; --nt-steel-top: #282929; --nt-steel-end: #161717; --nt-screw: #252626;
  --nt-face-0: #1a1a1a; --nt-face-1: #222222; --nt-face-2: #2c2c2c; --nt-face-3: #303030; --nt-face-4: #343434;
  --nt-back-0: #151514; --nt-back-1: #1a1a19; --nt-back-2: #20201e; --nt-back-3: #252523; --nt-back-4: #292927;
  --nt-ink: #ededed; --nt-ghost: 15%;
  --nt-film: #2d2d2a; --nt-thick: #393935; --nt-thin: #252523; --nt-fuzz: #4d4c47;
  --nt-hole: #1e1f1f; --nt-island: #45443f; --nt-speck: #0a0a0a;
  --nt-delam: #3a3936; --nt-tear: #8e8d88;
  --nt-halo: #000000;
}

/* the wall */
[data-part="brick"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-a); }
[data-part="brick"][data-tint="b"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-b); }
[data-part="brick"][data-tint="c"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-c); }
[data-part="brick"][data-tint="d"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-d); }
[data-part="brick"][data-tint="e"] > .iso-shade[data-shade="2"] { fill: var(--nt-brick-e); }
.nt-mortar { fill: var(--nt-mortar); stroke: none; }
.nt-crop { stroke: none; }
.nt-crop-0 { stop-color: var(--anatomy-card); stop-opacity: 0; }
.nt-crop-1 { stop-color: var(--anatomy-card); stop-opacity: .35; }
.nt-crop-2 { stop-color: var(--anatomy-card); stop-opacity: .85; }
.nt-crop-3 { stop-color: var(--anatomy-card); stop-opacity: 1; }
[data-part="brick"] > .iso-top { fill: var(--nt-brick-top); }
[data-part="brick"] > .iso-shade[data-shade="0"] { fill: var(--nt-brick-end); }
[data-part="mortar"] > .iso-shade[data-shade="2"] { fill: var(--nt-mortar); }
[data-part="mortar"] > .iso-top { fill: var(--nt-mortar-top); }
[data-part="mortar"] > .iso-shade[data-shade="0"] { fill: var(--nt-mortar-end); }
.nt-tex { stroke: none; }
.nt-tx-pit { fill: var(--nt-pit); opacity: .55; }
.nt-tx-fleck { fill: var(--nt-fleck); opacity: .9; }
.nt-tx-grit { fill: var(--nt-grit); opacity: .5; }
.nt-tx-sand { fill: var(--nt-sand); opacity: .55; }
.nt-tx-sandlight { fill: var(--nt-sand-light); opacity: .8; }
.nt-chip { fill: var(--nt-chip); stroke: var(--anatomy-lo); stroke-width: .5px; stroke-linejoin: round; }

/* the plate */
.nt-steel > .iso-shade[data-shade="2"] { fill: var(--nt-steel-face); }
.nt-steel > .iso-top { fill: var(--nt-steel-top); }
.nt-steel > .iso-shade[data-shade="0"] { fill: var(--nt-steel-end); }
.nt-grain .iso-line { stroke-width: .45px; }
.nt-grain [data-weight="0"] { opacity: .45; }
.nt-grain [data-weight="1"] { opacity: .7; }
.nt-screw { fill: var(--nt-screw); stroke: none; }
.nt-plate-halo { fill: var(--nt-halo); stroke: none; opacity: calc(var(--anatomy-halo-opacity) * .8); filter: blur(5px); }

/* residue */
.nt-film { fill: var(--nt-film); stroke: none; }
.nt-tx-thick { fill: var(--nt-thick); opacity: .7; }
.nt-tx-thin { fill: var(--nt-thin); opacity: .55; }
.nt-tx-fuzz { fill: var(--nt-fuzz); opacity: .85; }
.nt-holes path { fill: none; stroke: var(--nt-thick); stroke-width: .4px; stroke-linejoin: round; }
.nt-scrapes path { fill: var(--nt-hole); stroke: none; }
.nt-islands path { fill: var(--nt-island); stroke: var(--anatomy-lo); stroke-width: .4px; stroke-linejoin: round; }
.nt-specks circle { fill: var(--nt-speck); opacity: .55; }

/* the label */
.nt-flat, .nt-stuck, .nt-slot { --nt-paper: var(--nt-face-2); }
:is(.nt-flat, .nt-stuck, .nt-slot[data-side="face"])[data-band="0"] { --nt-paper: var(--nt-face-0); }
:is(.nt-flat, .nt-stuck, .nt-slot[data-side="face"])[data-band="1"] { --nt-paper: var(--nt-face-1); }
:is(.nt-flat, .nt-stuck, .nt-slot[data-side="face"])[data-band="3"] { --nt-paper: var(--nt-face-3); }
:is(.nt-flat, .nt-stuck, .nt-slot[data-side="face"])[data-band="4"] { --nt-paper: var(--nt-face-4); }
.nt-slot[data-side="back"][data-band="0"] { --nt-paper: var(--nt-back-0); }
.nt-slot[data-side="back"][data-band="1"] { --nt-paper: var(--nt-back-1); }
.nt-slot[data-side="back"][data-band="2"] { --nt-paper: var(--nt-back-2); }
.nt-slot[data-side="back"][data-band="3"] { --nt-paper: var(--nt-back-3); }
.nt-slot[data-side="back"][data-band="4"] { --nt-paper: var(--nt-back-4); }
.nt-face, .nt-strip { fill: var(--nt-paper); stroke: none; }
.nt-seam { fill: none; stroke: var(--nt-paper); stroke-width: .8px; stroke-linecap: round; }
.nt-under { fill: var(--anatomy-paper); stroke: none; }
.nt-side { stroke: none; }
.nt-side[data-shade="0"] { fill: var(--nt-face-0); }
.nt-side[data-shade="1"] { fill: var(--nt-face-1); }
.nt-side[data-shade="2"] { fill: var(--nt-face-1); }
.nt-side[data-shade="3"] { fill: var(--nt-face-2); }
.nt-delam { fill: var(--nt-delam); stroke: none; }
.nt-halo { fill: var(--nt-halo); stroke: none; }
.nt-edge { fill: none; stroke: var(--anatomy-lit); stroke-width: .7px; stroke-linecap: round; stroke-linejoin: round; }
.nt-tear { fill: none; stroke: var(--nt-tear); stroke-width: .6px; stroke-linecap: round; stroke-linejoin: round; }
.nt-ink { fill: none; stroke: var(--nt-ink); stroke-linecap: round; stroke-linejoin: round; }
.nt-ghost { fill: none; stroke: color-mix(in srgb, var(--nt-ink) var(--nt-ghost), var(--nt-paper)); stroke-width: 1.3px; stroke-linecap: round; stroke-linejoin: round; }
.nt-slot[data-empty] { display: none; }
.nt-stage { touch-action: pan-y; cursor: ew-resize; outline: none; }

path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" d=""/><path class="nt-ghost" d=""/><path class="nt-ink" d="" style="stroke-width:1.70px"/><path class="nt-tear" d=""/><path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" d=""/><path class="nt-ghost" d=""/><path class="nt-ink" d="" style="stroke-width:1.70px"/><path class="nt-tear" d=""/><path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" d=""/><path class="nt-ghost" d=""/><path class="nt-ink" d="" style="stroke-width:1.70px"/><path class="nt-tear" d=""/><path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" d=""/><path class="nt-ghost" d=""/><path class="nt-ink" d="" style="stroke-width:1.70px"/><path class="nt-tear" d=""/><path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" d=""/><path class="nt-ghost" d=""/><path class="nt-ink" d="" style="stroke-width:1.70px"/><path class="nt-tear" d=""/><path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" d=""/><path class="nt-ghost" d=""/><path class="nt-ink" d="" style="stroke-width:1.70px"/><path class="nt-tear" d=""/><path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" d=""/><path class="nt-ghost" d=""/><path class="nt-ink" d="" style="stroke-width:1.70px"/><path class="nt-tear" d=""/><path class="nt-edge" d=""/></g><g class="nt-slot" data-side="face" data-band="2" data-empty=""><path class="nt-strip" d=""/><path class="nt-seam" 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>The label: a blank name sticker, 86 × 59 mm</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Residue: adhesive and paper fibre left on the steel</span></span><span class="iso-caption">A blank name sticker on a brushed steel plate, screwed to a brick wall. Picked at one corner, it rolls up into a single curl with the printed face inside, then tears unevenly: 62% comes away with half the scribble and the rest stays, a ragged piece with a fibrous torn edge. Where it came off, the adhesive split and kept a fuzz of paper fibre, broken by rows of bare spots where the front stuck and slipped. The force is Kendall's peel, F = G·b / (1 − cos θ), with G = 100 J/m² and b the length of the front.</span></figcaption></figure></main><script type="module">// A blank name sticker torn off a steel plate on a brick wall: one curl that comes away, a ragged
// piece that stays, the residue in between, and the numbers the card reads. Pure: no DOM, no
// imports. The build imports PEEL; the page inlines this file with `export` stripped, so every
// name lives inside PEEL and nothing clashes with anything else on the page.

const PEEL = (() => {
  const MM = 2; // world units per millimetre
  const RAD = Math.PI / 180;
  const ENV = typeof process !== "undefined" && process.env ? process.env : {};

  // ---- Small vector helpers ------------------------------------------------------------------------
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const unit = (a) => {
    const l = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / l, a[1] / l, a[2] / l];
  };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const mix = (a, b, t) => a + (b - a) * t;
  function rng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const areaOf = (ring) => {
    let a = 0;
    for (let i = 0; i < ring.length; i++) {
      const [x0, y0] = ring[i];
      const [x1, y1] = ring[(i + 1) % ring.length];
      a += x0 * y1 - x1 * y0;
    }
    return a / 2;
  };
  const inside = (ring, [x, y]) => {
    let c = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
    }
    return c;
  };

  // ---- Layout (world units of 0.5 mm; x along the wall, y out of it, z up) ------------------------
  // A fragment of a half-brick wall in running bond, the brick faces in the plane y = 0.
  const BRICK = { l: 388, h: 114, d: 184 }; // US modular, 194 × 57 × 92 mm
  const JOINT = 20; // 10 mm joints, raked 2 mm back
  const RAKE = 4;
  const COURSE = BRICK.h + JOINT;
  const MODULE = BRICK.l + JOINT;
  const BOND = 110; // where the bond sits along the wall
  // Each course's extent: toothed ends, as a wall left mid-build.
  const COURSES = [
    [-300, 294],
    [-298, 206],
    [-250, 294],
    [-298, 250],
  ];
  // The plate: 128 × 88 mm of 3 mm brushed stainless, 6 mm off the bricks on four spacers.
  const PLATE = { x: -128, z: 174, w: 256, h: 176, r: 8 };
  const STANDOFF = 12;
  const PLATE_T = 6;
  const Y_FACE = STANDOFF + PLATE_T;
  const SCREW_IN = 15;

  // The label: an 86 × 59 mm name badge, die-cut with 3.2 mm corners, stuck on by hand a little
  // askew. Its own plane: u to the right, v down the wall, normal N out of the plate.
  const TAG = { w: 86 * MM, h: 59 * MM, r: 3.2 * MM };
  const TAG_T = 0.45;
  const CENTRE = [5, 263]; // x, z on the plate face
  const ROT = -1.4 * RAD;
  const N = [0, 1, 0];
  const E1 = [1, 0, 0];
  const E2 = [0, 0, -1];
  const EX = add(mul(E1, Math.cos(ROT)), mul(E2, Math.sin(ROT)));
  const EY = add(mul(E1, -Math.sin(ROT)), mul(E2, Math.cos(ROT)));
  const FACE0 = [CENTRE[0], Y_FACE, CENTRE[1]]; // the plate face under the label's centre
  const onFace = ([u, v], h = 0) => add(FACE0, add(mul(EX, u), add(mul(EY, v), mul(N, h))));
  const uvDir = ([a, b]) => add(mul(EX, a), mul(EY, b));

  // Peel coordinates in the label plane: d runs from the first corner to lift (top left) toward
  // the bottom right; w runs along the peel front.
  const ALPHA = Number(ENV.NT_ALPHA ?? 45) * RAD;
  const D2 = [Math.cos(ALPHA), Math.sin(ALPHA)];
  const W2 = [-Math.sin(ALPHA), Math.cos(ALPHA)];
  const toDW = ([u, v]) => [u * D2[0] + v * D2[1], u * W2[0] + v * W2[1]];
  const toUV = ([d, w]) => [d * D2[0] + w * W2[0], d * D2[1] + w * W2[1]];
  const DW = uvDir(D2);
  const WW = uvDir(W2);
  const dwDir = ([a, b]) => add(mul(DW, a), mul(WW, b));

  // ---- Camera (the kit's projection and light, copied so this file stands alone) ----------------
  const UNIT = Math.sqrt(1.6);
  const BANDS = [0, 0.2, 0.42, 0.62];
  function camera(P) {
    const a = (P.azimuth ?? 45) * RAD;
    const e = (P.elevation ?? 30) * RAD;
    const sinA = Math.sin(a), cosA = Math.cos(a), sinE = Math.sin(e), cosE = Math.cos(e);
    return { sinA, cosA, sinE, cosE, k: P.scale * UNIT, origin: P.origin, V: [cosA * cosE, sinA * cosE, sinE], L: unit([-sinA, cosA, 1.2]) };
  }
  const project = (C, [x, y, z]) => [C.origin[0] + (x * C.sinA - y * C.cosA) * C.k, C.origin[1] + ((x * C.cosA + y * C.sinA) * C.sinE - z * C.cosE) * C.k];
  const bandOf = (score) => {
    let tone = 0;
    while (tone < BANDS.length && score >= BANDS[tone]) tone++;
    return tone;
  };

  // ---- The label, and the line it tears along ------------------------------------------------------
  function roundedRing({ w, h, r }, steps = 10) {
    const out = [];
    const corners = [[w / 2 - r, -h / 2 + r, -90], [w / 2 - r, h / 2 - r, 0], [-w / 2 + r, h / 2 - r, 90], [-w / 2 + r, -h / 2 + r, 180]];
    for (const [cx, cy, start] of corners) {
      for (let i = 0; i <= steps; i++) {
        const a = (start + (90 * i) / steps) * RAD;
        out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
    }
    return out;
  }
  const OUTLINE = roundedRing(TAG, 10);
  const OUTLINE_DW = OUTLINE.map(toDW);
  const TAG_AREA = Math.abs(areaOf(OUTLINE));

  // The tear: from the top edge to the bottom edge, wandering, with a fine ragged walk and two
  // tongues where it ran sideways for a moment. A function of v, so it never doubles back.
  const TEAR = (() => {
    const R = rng(311);
    const top = -TAG.h / 2, bottom = TAG.h / 2;
    const n = 120;
    const out = [];
    let jag = 0;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      let u = mix(34, 4, t) + 9 * Math.sin(Math.PI * t * 1.35 + 0.4) + 3.2 * Math.sin(Math.PI * 2 * t * 2.7 + 1.2);
      u += -8 * Math.exp(-(((t - 0.36) / 0.03) ** 2)) + 6 * Math.exp(-(((t - 0.73) / 0.025) ** 2)) - 3 * Math.exp(-(((t - 0.55) / 0.05) ** 2));
      jag = jag * 0.7 + (R() - 0.5) * 1.9;
      const end = Math.min(t, 1 - t) < 0.02 ? 0 : 1;
      out.push([u + jag * end, top + (bottom - top) * t]);
    }
    return out;
  })();

  // Split the outline at the tear's two ends: the left part comes away, the right part stays.
  const SPLIT = (() => {
    const ring = OUTLINE.map((p) => [...p]);
    const insertOn = (p) => {
      for (let i = 0; i < ring.length; i++) {
        const a = ring[i], b = ring[(i + 1) % ring.length];
        if (Math.abs(a[1] - p[1]) < 1e-6 && Math.abs(b[1] - p[1]) < 1e-6 && (p[0] - a[0]) * (p[0] - b[0]) < 0) {
          ring.splice(i + 1, 0, p);
          return;
        }
      }
      throw new Error("tear end not on an edge");
    };
    const A = TEAR[0], B = TEAR[TEAR.length - 1];
    insertOn(A);
    insertOn(B);
    const iA = ring.indexOf(A), iB = ring.indexOf(B);
    const chain = (from, to) => {
      const out = [];
      for (let i = from; ; i = (i + 1) % ring.length) {
        out.push(ring[i]);
        if (i === to) break;
      }
      return out;
    };
    const one = chain(iA, iB), two = chain(iB, iA);
    const leftOf = (c) => Math.min(...c.map((p) => p[0]));
    const left = leftOf(one) < leftOf(two) ? one : two;
    const right = left === one ? two : one;
    const inner = TEAR.slice(1, -1);
    const close = (c) => (c[0] === A ? [...inner].reverse() : inner);
    const flap = [...left, ...close(left)];
    const stuck = [...right, ...close(right)];
    const kindsOf = (c) => [...c.slice(0, -1).map(() => "die"), ...Array(inner.length + 1).fill("tear")];
    return { flap, flapKind: kindsOf(left), stuck, stuckKind: kindsOf(right) };
  })();
  const FLAP = SPLIT.flap;
  const STUCK = SPLIT.stuck;
  const FLAP_DW = FLAP.map(toDW);
  const FLAP_AREA = Math.abs(areaOf(FLAP));
  const D_MIN = Math.min(...OUTLINE_DW.map(([d]) => d));
  const D_END = Math.max(...FLAP_DW.map(([d]) => d));
  const W_MIN = Math.min(...FLAP_DW.map(([, w]) => w));
  const W_MAX = Math.max(...FLAP_DW.map(([, w]) => w));

  // Ear-clip the flap into triangles once; each keeps which of its edges are die-cut or torn.
  function triangulate(pts) {
    const sgn = areaOf(pts) > 0 ? 1 : -1;
    const idx = [...pts.keys()];
    const cr = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const inTri = (p, a, b, c) => cr(a, b, p) * sgn > 1e-9 && cr(b, c, p) * sgn > 1e-9 && cr(c, a, p) * sgn > 1e-9;
    const tris = [];
    let guard = 0;
    while (idx.length > 3 && guard++ < 200000) {
      let cut = -1;
      for (let i = 0; i < idx.length && cut < 0; i++) {
        const a = pts[idx[(i + idx.length - 1) % idx.length]], b = pts[idx[i]], c = pts[idx[(i + 1) % idx.length]];
        if (cr(a, b, c) * sgn <= 1e-10) continue;
        let ok = true;
        for (const j of idx) {
          const p = pts[j];
          if (p === a || p === b || p === c) continue;
          if (inTri(p, a, b, c)) {
            ok = false;
            break;
          }
        }
        if (ok) cut = i;
      }
      if (cut < 0) {
        // only collinear vertices are left to clip: drop one, the shape is unchanged
        const flat = idx.findIndex((_, i) => Math.abs(cr(pts[idx[(i + idx.length - 1) % idx.length]], pts[idx[i]], pts[idx[(i + 1) % idx.length]])) <= 1e-10);
        if (flat < 0) break;
        idx.splice(flat, 1);
        continue;
      }
      tris.push([idx[(cut + idx.length - 1) % idx.length], idx[cut], idx[(cut + 1) % idx.length]]);
      idx.splice(cut, 1);
    }
    if (idx.length === 3) tris.push([...idx]);
    return tris;
  }
  const TRIS = (() => {
    const n = FLAP_DW.length;
    const kindOf = (a, b) => ((a + 1) % n === b ? SPLIT.flapKind[a] : (b + 1) % n === a ? SPLIT.flapKind[b] : "in");
    return triangulate(FLAP_DW).map(([a, b, c]) => {
      const p = [FLAP_DW[a], FLAP_DW[b], FLAP_DW[c]];
      return { p, kind: [kindOf(a, b), kindOf(b, c), kindOf(c, a)], lo: Math.min(p[0][0], p[1][0], p[2][0]), hi: Math.max(p[0][0], p[1][0], p[2][0]) };
    });
  })();

  // Clip a convex polygon in (d, w) to lo <= d <= hi, carrying each edge's kind; cuts are "cut".
  function clipBand(pts, kinds, lo, hi) {
    let poly = pts.map((p, i) => ({ p, kind: kinds[i] }));
    const pass = (keep, value) => {
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i], b = poly[(i + 1) % poly.length];
        const ia = keep(a.p), ib = keep(b.p);
        const at = () => {
          const t = (value - a.p[0]) / (b.p[0] - a.p[0]);
          return [value, a.p[1] + (b.p[1] - a.p[1]) * t];
        };
        if (ia && ib) out.push(a);
        else if (ia && !ib) {
          out.push(a);
          out.push({ p: at(), kind: "cut" });
        } else if (!ia && ib) out.push({ p: at(), kind: a.kind });
      }
      poly = out;
    };
    if (lo > -Infinity) pass((p) => p[0] >= lo - 1e-9, lo);
    if (poly.length && hi < Infinity) pass((p) => p[0] <= hi + 1e-9, hi);
    return poly;
  }
  // Long edges get extra points, so a wavy sheet bends along them too.
  function densify(poly, most = 7) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      out.push(a);
      const len = Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1]);
      const k = Math.ceil(len / most);
      for (let j = 1; j < k; j++) out.push({ p: [a.p[0] + ((b.p[0] - a.p[0]) * j) / k, a.p[1] + ((b.p[1] - a.p[1]) * j) / k], kind: a.kind });
    }
    return out;
  }

  // Area of the flap on the peeled side of d = f, and the length of the front across it.
  function peeledArea(f) {
    let a = 0;
    for (const t of TRIS) {
      if (t.lo >= f) continue;
      const poly = clipBand(t.p, t.kind, -Infinity, f);
      if (poly.length >= 3) a += Math.abs(areaOf(poly.map(({ p }) => p)));
    }
    return a;
  }
  function chordAt(f) {
    let len = 0;
    for (const t of TRIS) {
      if (t.lo > f || t.hi < f) continue;
      const ws = [];
      for (let i = 0; i < 3; i++) {
        const a = t.p[i], b = t.p[(i + 1) % 3];
        if ((a[0] - f) * (b[0] - f) <= 0 && a[0] !== b[0]) ws.push(a[1] + ((b[1] - a[1]) * (f - a[0])) / (b[0] - a[0]));
      }
      if (ws.length >= 2) len += Math.max(...ws) - Math.min(...ws);
    }
    return len;
  }

  // ---- The curl -------------------------------------------------------------------------------------
  // Paper bent at a peel front keeps the bend, printed face inside, so the flap rolls up over the
  // part still stuck: a tight bend at the front through the peel angle θ, then a slowly
  // tightening spiral. It is not quite a cylinder: worn paper curls tighter in some places than
  // others along the front, so the sheet waves.
  const DS = 0.5;
  const RC_MIN = 6;
  function profileOf({ theta, rb, k0, beta }, sigmaMax) {
    const n = Math.max(2, Math.ceil(sigmaMax / DS) + 2);
    const X = new Float64Array(n), Z = new Float64Array(n), PHI = new Float64Array(n);
    const bendEnd = theta * rb;
    let x = 0, z = 0, phi = 0;
    for (let i = 1; i < n; i++) {
      const s = (i - 0.5) * DS;
      const k = s < bendEnd ? 1 / rb : Math.min(1 / RC_MIN, k0 * Math.exp(beta * Math.max(0, phi - theta)));
      const mid = phi + (k * DS) / 2;
      x += -Math.cos(mid) * DS;
      z += Math.sin(mid) * DS;
      phi += k * DS;
      X[i] = x;
      Z[i] = z;
      PHI[i] = phi;
    }
    return { X, Z, PHI, n };
  }
  function profileAt(pr, sigma) {
    const t = clamp(sigma / DS, 0, pr.n - 1.000001);
    const i = Math.floor(t);
    const f = t - i;
    return [pr.X[i] + (pr.X[i + 1] - pr.X[i]) * f, pr.Z[i] + (pr.Z[i + 1] - pr.Z[i]) * f, pr.PHI[i] + (pr.PHI[i + 1] - pr.PHI[i]) * f];
  }
  const W_SAMPLES = Array.from({ length: 9 }, (_, i) => W_MIN - 4 + ((W_MAX - W_MIN + 8) * i) / 8);
  const waveK = (w) => 1 + 0.17 * Math.sin(w * 0.061 + 1.1) + 0.07 * Math.sin(w * 0.17 + 0.3);
  const waveT = (w) => 1 + 0.07 * Math.sin(w * 0.045 + 2.1);

  // Where the peel is, as one number s: 0 stuck flat · LIFT the corner is up · 1 the flap tears
  // free · 1 + OFF it has fallen away. The tour and the pointer both drive s.
  const LIFT = 0.12;
  const OFF = 0.34;
  const LIFT_D = 8 * MM;
  const S_END = 1 + OFF;
  const TUNE = {
    liftAngle: 46, peelAngle: 34,
    rbLift: 7, rbPeel: 4.2,
    curlLift: 1 / 200, curlPeel: 1 / 27,
    betaLift: 0.03, betaPeel: 0.05,
  };
  function frontAt(s) {
    s = clamp(s, 0, S_END);
    const lift = smooth(0, LIFT, s);
    const peel = clamp((s - LIFT) / (1 - LIFT), 0, 1);
    const run = peel <= 0 ? 0 : peel >= 1 ? 1 : mix(peel, smooth(0, 1, peel), 0.3);
    return Math.min(D_END, D_MIN + LIFT_D * Math.pow(lift, 1.4) + (D_END - D_MIN - LIFT_D) * run);
  }
  function sAtFront(f) {
    let lo = LIFT, hi = 1;
    for (let i = 0; i < 40; i++) {
      const m = (lo + hi) / 2;
      if (frontAt(m) < f) lo = m;
      else hi = m;
    }
    return (lo + hi) / 2;
  }
  function stateAt(s) {
    s = clamp(s, 0, S_END);
    const lift = smooth(0, LIFT, s);
    const peel = clamp((s - LIFT) / (1 - LIFT), 0, 1);
    const f = frontAt(s);
    const grow = smooth(0, 0.45, peel);
    const theta = (TUNE.liftAngle * lift + TUNE.peelAngle * grow) * RAD;
    const rb = mix(TUNE.rbLift, TUNE.rbPeel, lift);
    const k0 = mix(0, TUNE.curlLift, lift) + mix(0, TUNE.curlPeel - TUNE.curlLift, grow);
    const beta = mix(TUNE.betaLift, TUNE.betaPeel, grow);
    const off = smooth(1, S_END, s);
    return { s, f, theta, rb, k0, beta, off, free: s >= 1, peeled: peeledArea(f) / TAG_AREA, chord: chordAt(f) };
  }

  // Once torn free the flap falls: it drops and swings out from the wall, rolling on about its
  // curl and turning a little as it goes.
  const PIVOT = onFace(toUV(FLAP_DW.reduce((best, q) => (q[0] > best[0] ? q : best))), TAG_T);
  function rotateAbout(p, o, a, angle) {
    const v = sub(p, o);
    const c = Math.cos(angle), s = Math.sin(angle);
    return add(o, add(mul(v, c), add(mul(cross(a, v), s), mul(a, dot(a, v) * (1 - c)))));
  }
  const rotateDir = (v, a, angle) => {
    const c = Math.cos(angle), s = Math.sin(angle);
    return add(mul(v, c), add(mul(cross(a, v), s), mul(a, dot(a, v) * (1 - c))));
  };
  function motionOf(off, place) {
    const e = off * off * (3 - 2 * off);
    return { roll: 34 * RAD * e, spin: -16 * RAD * e, move: add(mul(N, 46 * e + place), [10 * e, 0, -150 * off * off]) };
  }

  // ---- One frame of the sheet ----------------------------------------------------------------------
  function sheetOf(st, { place = 0 } = {}) {
    const sigmaMax = Math.max(0, st.f - D_MIN) + 2;
    const profiles = W_SAMPLES.map((w) => profileOf({ ...st, k0: st.k0 * waveK(w), theta: st.theta * waveT(w) }, sigmaMax));
    const base = onFace([0, 0], TAG_T);
    const m = motionOf(st.off, place);
    const moved = st.off > 0 || place > 0;
    const pose = (p) => {
      if (!moved) return p;
      let q = p;
      if (st.off > 0) q = rotateAbout(rotateAbout(q, PIVOT, WW, m.roll), PIVOT, N, m.spin);
      return add(q, m.move);
    };
    const poseDir = (v) => (st.off > 0 ? rotateDir(rotateDir(v, WW, m.roll), N, m.spin) : v);
    const step = W_SAMPLES[1] - W_SAMPLES[0];
    const shapeAt = (sigma, w) => {
      const t = clamp((w - W_SAMPLES[0]) / step, 0, W_SAMPLES.length - 1.000001);
      const i = Math.floor(t);
      const f = t - i;
      const a = profileAt(profiles[i], sigma), b = profileAt(profiles[i + 1], sigma);
      return [mix(a[0], b[0], f), mix(a[1], b[1], f), mix(a[2], b[2], f)];
    };
    const at = (d, w) => {
      if (d >= st.f) return pose(add(base, dwDir([d, w])));
      const [x, z] = shapeAt(st.f - d, w);
      return pose(add(base, add(dwDir([st.f + x, w]), mul(N, z))));
    };
    const normalAt = (d, w) => {
      if (d >= st.f) return poseDir(N);
      const [, , phi] = shapeAt(st.f - d, w);
      return poseDir(unit(add(mul(DW, Math.sin(phi)), mul(N, Math.cos(phi)))));
    };
    return { st, at, normalAt, poseDir, moved };
  }

  // Strip boundaries in d for the flap: fine through the tight bend, coarser up the curl.
  function cutsOf(st) {
    const cuts = [];
    if (st.f <= D_MIN) return cuts;
    const bend = st.theta * st.rb;
    let sigma = 0;
    cuts.push(st.f);
    while (st.f - sigma > D_MIN) {
      sigma += sigma < bend + 2 ? 0.7 : sigma < bend + 30 ? 1.3 : 2;
      cuts.push(Math.max(D_MIN, st.f - sigma));
    }
    return cuts;
  }

  function frameOf(st, P, { place = 0 } = {}) {
    const C = camera(P);
    const sheet = sheetOf(st, { place });
    const scr = (p) => project(C, p);
    const out = { flat: null, strips: [], sheet, C };
    // Everything still flat: the label ahead of the front, or the whole of a new one coming down.
    // Once the flap is free the piece that stayed is drawn once, statically, so nothing flat moves.
    if (!st.free || place > 0) {
      const poly = clipBand(OUTLINE_DW, OUTLINE_DW.map(() => "die"), st.f, Infinity);
      if (poly.length >= 3) {
        const pts = poly.map(({ p }) => sheet.at(p[0], p[1]));
        out.flat = { pts, kind: poly.map(({ kind }) => kind), dw: poly.map(({ p }) => p) };
      }
    }
    const cuts = cutsOf(st);
    const wMid = (W_MIN + W_MAX) / 2;
    for (let i = 0; i + 1 < cuts.length; i++) {
      const hi = cuts[i], lo = cuts[i + 1];
      if (hi - lo < 1e-6) continue;
      // The torn flap is not convex, so the band's clip can come back as several pieces joined by
      // zero-width bridges along a cut; those are marked so nothing strokes them.
      const poly = clipBand(FLAP_DW, SPLIT.flapKind, lo, hi);
      if (poly.length < 3 || Math.abs(areaOf(poly.map(({ p }) => p))) < 1e-4) continue;
      const m = poly.length;
      for (let j = 0; j < m; j++) {
        if (poly[j].kind !== "cut") continue;
        const a = poly[j].p, b = poly[(j + 1) % m].p;
        const line = Math.abs(a[0] - lo) < 1e-6 ? lo : hi;
        const nudge = line === lo ? 0.03 : -0.03;
        if (!inside(FLAP_DW, [(a[0] + b[0]) / 2 + nudge, (a[1] + b[1]) / 2])) poly[j] = { p: poly[j].p, kind: "bridge" };
      }
      const dense = densify(poly);
      let wSum = 0;
      for (const { p } of dense) wSum += p[1];
      const mid = (lo + hi) / 2;
      const n = sheet.normalAt(mid, wSum / dense.length);
      const facing = dot(n, C.V);
      const side = facing >= 0 ? "face" : "back";
      out.strips.push({
        index: i, lo, hi, side,
        band: bandOf(dot(side === "face" ? n : mul(n, -1), C.L)),
        facing: Math.abs(facing),
        // Strips are near-straight lines along w; their order is their order across the curl.
        key: dot(sheet.at(mid, wMid), C.V),
        scr: dense.map(({ p }) => scr(sheet.at(p[0], p[1]))),
        kind: dense.map(({ kind }) => kind),
        dw: dense.map(({ p }) => p),
      });
    }
    return out;
  }

  // ---- The name: an illegible marker scribble -------------------------------------------------------
  // A signature dashed off in marker: a big looped capital, a run of humps and loops that never
  // settle into letters, a dropped tail and an underline flung back under the word.
  const SCRIBBLE = (() => {
    const main = [
      [-66, 2], [-61, -6], [-57, -27], [-60, -31], [-63, -22], [-60, -4], [-57, 6], [-52, 9], [-47, 1], [-49, -4],
      [-52, 1], [-46, 4], [-42, -9], [-39, -2], [-36, -10], [-33, -1], [-29, -11], [-26, 1], [-22, -6], [-19, -32],
      [-22, -35], [-23, -24], [-18, 1], [-14, -8], [-11, -10], [-13, -6], [-9, 1], [-5, -9], [-2, -3], [1, -10],
      [4, 0], [7, -5], [9, -27], [6, -29], [7, -14], [11, 1], [14, -6], [16, -1], [16, 12], [12, 18], [8, 14],
      [13, 4], [19, -4], [23, 1], [27, -7], [31, 0], [36, -6], [41, -1], [47, -5], [52, 2], [54, 7], [44, 11],
      [18, 13], [-12, 12], [-40, 11],
    ];
    const bar = [[-31, -23], [-20, -26], [-6, -25.5]];
    const tittle = [[25, -17], [26.4, -17.6]];
    const smoothStroke = (pts) => {
      const out = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
        const n = Math.max(1, Math.ceil(len / 0.8));
        for (let j = 0; j < n; j++) {
          const t = j / n, t2 = t * t, t3 = t2 * t;
          const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
          out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
        }
      }
      out.push(pts[pts.length - 1]);
      return out;
    };
    // written on a slight upward drift, a little left of centre
    const drift = ([u, v]) => [u - 2, v + 4 - u * 0.06];
    return [main, bar, tittle].map((s) => smoothStroke(s.map(drift)));
  })();
  // Each stroke split where it crosses the tear: runs on the flap and on the piece that stays.
  const INK = (() => {
    const flap = [], stuck = [];
    for (const stroke of SCRIBBLE) {
      let side = inside(FLAP, stroke[0]);
      let run = [stroke[0]];
      for (let i = 1; i < stroke.length; i++) {
        const p = stroke[i];
        const s = inside(FLAP, p);
        if (s !== side) {
          let a = stroke[i - 1], b = p;
          for (let k = 0; k < 24; k++) {
            const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
            if (inside(FLAP, m) === side) a = m;
            else b = m;
          }
          const q = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          run.push(q);
          (side ? flap : stuck).push(run);
          run = [q];
          side = s;
        }
        run.push(p);
      }
      (side ? flap : stuck).push(run);
    }
    return { flap: flap.filter((r) => r.length > 1).map((r) => r.map(toDW)), stuck: stuck.filter((r) => r.length > 1), all: SCRIBBLE.map((s) => s.map(toDW)) };
  })();

  // Ink per frame: on the flat part (all ink ahead of the front) and per strip of the flap.
  function inkOf(frame) {
    const { sheet, C } = frame;
    const st = sheet.st;
    const cuts = cutsOf(st);
    const stripOf = (d) => {
      if (d >= st.f) return -1;
      let lo = 0, hi = cuts.length - 1;
      while (hi - lo > 1) {
        const m = (lo + hi) >> 1;
        if (cuts[m] > d) lo = m;
        else hi = m;
      }
      return lo;
    };
    const runs = new Map();
    const bounds = cuts.length ? cuts : [st.f];
    const split = (stroke, keep) => {
      const push = (key, pts) => {
        if (pts.length < 2 || !keep(key)) return;
        if (!runs.has(key)) runs.set(key, []);
        runs.get(key).push(pts.map((p) => project(C, sheet.at(p[0], p[1]))));
      };
      let run = [stroke[0]];
      let key = stripOf(stroke[0][0]);
      for (let i = 1; i < stroke.length; i++) {
        const a = stroke[i - 1], b = stroke[i];
        const lo = Math.min(a[0], b[0]), hi = Math.max(a[0], b[0]);
        const ts = bounds.filter((c) => c > lo && c < hi).map((c) => (c - a[0]) / (b[0] - a[0])).sort((x, y) => x - y);
        for (const t of ts) {
          const p = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
          run.push(p);
          push(key, run);
          key = stripOf(a[0] + (b[0] - a[0]) * Math.min(1, t + 1e-4));
          run = [p];
        }
        run.push(b);
      }
      push(key, run);
    };
    // Ahead of the front all the ink is flat, on both sides of the tear-to-be.
    if (frame.flat) for (const stroke of INK.all) split(stroke, (key) => key === -1);
    // Behind it only the flap's ink moves; the rest is drawn once, on the piece that stayed.
    if (st.f > D_MIN) for (const stroke of INK.flap) split(stroke, (key) => key >= 0);
    return runs;
  }

  // ---- Residue ---------------------------------------------------------------------------------------
  // Where the flap was: the adhesive split, so a fuzz of paper fibre lies in it; the front stuck and
  // slipped, leaving rows of bare spots across it; clean patches where it let go; white islands of
  // paper where it held hardest, by the corner that was picked; a fingernail's scrapes. In (u, v).
  const RESIDUE = (() => {
    const R = rng(9203);
    const blob = (cx, cy, r, k, jag = 0.3, stretch = [1, 1], turn = 0) => {
      const out = [];
      const ph = R() * 6;
      for (let i = 0; i < k; i++) {
        const a = (i / k) * Math.PI * 2;
        const rr = r * (1 + jag * (Math.sin(a * 3 + ph) * 0.5 + (R() - 0.5)));
        const x = Math.cos(a) * rr * stretch[0], y = Math.sin(a) * rr * stretch[1];
        out.push([cx + x * Math.cos(turn) - y * Math.sin(turn), cy + x * Math.sin(turn) + y * Math.cos(turn)]);
      }
      return out;
    };
    const inFlap = (p) => inside(FLAP, p);
    const along = Math.atan2(W2[1], W2[0]);
    const stops = [];
    for (let d = D_MIN + 22; d < D_END - 6; d += 10 + R() * 8) stops.push(d);
    const holes = [];
    for (const d of stops) {
      for (let w = W_MIN; w < W_MAX; w += 3.5 + R() * 6) {
        if (R() < 0.35) continue;
        const [u, v] = toUV([d + (R() - 0.5) * 1.6, w]);
        if (!inFlap([u, v])) continue;
        holes.push(blob(u, v, 1.2 + R() * 3.4, 9, 0.35, [1, 0.42], along));
      }
    }
    for (let i = 0; i < 22; i++) {
      const [u, v] = toUV([mix(D_MIN + 30, D_END - 4, Math.sqrt(R())), mix(W_MIN, W_MAX, R())]);
      if (!inFlap([u, v])) continue;
      holes.push(blob(u, v, 1.5 + R() * 4.5, 12, 0.45, [1.4, 0.8], R() * Math.PI));
    }
    const corner = toUV(FLAP_DW.reduce((best, q) => (q[0] < best[0] ? q : best)));
    const islands = [];
    for (let i = 0; i < 16; i++) {
      const near = i < 9;
      const [u, v] = near ? [corner[0] + 6 + R() * 26, corner[1] + 5 + R() * 20] : toUV([mix(D_MIN, D_END, R()), mix(W_MIN, W_MAX, R())]);
      if (!inFlap([u, v])) continue;
      islands.push(blob(u, v, near ? 1.6 + R() * 3.4 : 0.8 + R() * 1.6, 10, 0.55, [1.3, 0.8], R() * Math.PI));
    }
    const scratches = [];
    for (let i = 0; i < 7; i++) {
      const [u, v] = [corner[0] + 8 + R() * 30, corner[1] + 4 + R() * 26];
      const len = 8 + R() * 20, a = -0.5 + (R() - 0.5) * 0.25;
      const half = 0.22 + R() * 0.18;
      const pts = [];
      for (let k = 0; k <= 10; k++) pts.push([u + Math.cos(a) * len * (k / 10), v + Math.sin(a) * len * (k / 10), half * Math.sin((Math.PI * k) / 10)]);
      scratches.push([...pts.map(([x, y, h]) => [x - Math.sin(a) * h, y + Math.cos(a) * h]), ...pts.map(([x, y, h]) => [x + Math.sin(a) * h, y - Math.cos(a) * h]).reverse()]);
    }
    const specks = [];
    for (let i = 0; i < 90; i++) {
      const p = [(R() - 0.5) * TAG.w, (R() - 0.5) * TAG.h];
      if (inFlap(p)) specks.push([...p, 0.2 + R() * 0.32]);
    }
    return { stops, holes, islands, scratches, specks };
  })();

  // The piece that stayed: along its torn edge the top paper split away and left the fibrous under
  // layer showing, a pale ragged band; loose fibres stand out past the tear.
  const STUCK_EDGE = (() => {
    const R = rng(5507);
    let w = 0;
    const inner = TEAR.map(([u, v], i) => {
      w = w * 0.75 + (R() - 0.2) * 1.5;
      return [u + clamp(1.4 + 2.6 * (0.5 + 0.5 * Math.sin(i * 0.21 + 0.7)) + w, 0.6, 6.5), v];
    });
    const fibres = [];
    for (let i = 2; i < TEAR.length - 2; i++) {
      if (R() < 0.45) continue;
      const [u, v] = TEAR[i];
      const len = 0.8 + R() * 2.4;
      const a = Math.PI + (R() - 0.5) * 1.2;
      fibres.push([[u + 0.2, v], [u + Math.cos(a) * len, v + Math.sin(a) * len]]);
    }
    return { band: [...TEAR, ...[...inner].reverse()], inner, fibres };
  })();

  // ---- The numbers -----------------------------------------------------------------------------------
  // Kendall's thin-film peel: F = G·b / (1 − cos θ), b the length of the front still on the flap.
  // A label acrylic on steel tears at about G = 100 J/m² (≈ 1.3 N per 25 mm at 180°).
  const G_ADHESIVE = 100;
  function forceAt(st) {
    const b = st.chord / MM / 1000;
    const c = 1 - Math.cos(Math.max(st.theta, 1 * RAD));
    return st.f >= D_END || st.f <= D_MIN + 0.01 ? 0 : (G_ADHESIVE * b) / c;
  }
  const SHARE_OFF = FLAP_AREA / TAG_AREA;

  // Stick-slip timing: the front lingers at each row of bare spots and jumps between them.
  let slipTable = null;
  function slipAt(t) {
    if (!slipTable) {

const DATA = {"P":{"origin":[300,510.26881720430106],"scale":0.9457946938238382,"azimuth":58,"elevation":26},"POOL":130,"inkWidth":1.7};

const { P, POOL, inkWidth } = DATA;

const stage = document.querySelector(".nt-stage");

const halo = svg.querySelector('[data-part="halo"]');
const flatG = svg.querySelector('[data-part="flat"]');
const flat = {
  g: flatG,
  under: flatG.querySelector(".nt-under"),
  sides: [...flatG.querySelectorAll(".nt-side")],
  fill: flatG.querySelector(".nt-face"),
  ink: flatG.querySelector(".nt-ink"),

  seam: g.querySelector(".nt-seam"),

  tear: g.querySelector(".nt-tear"),

const memoFlat = {};
const put = (memo, key, el, name, value) => {

// ---- Tour --------------------------------------------------------------------------------------

let state = { s: 0, place: 0, alpha: 1 };

const WORDS = {

  off: "Torn: the curl comes away and falls, a ragged piece stays stuck",

      put(slot.memo, "empty", slot.g, "data-empty", null);
      put(slot.memo, "side", slot.g, "data-side", s.side);
      put(slot.memo, "band", slot.g, "data-band", String(s.band));
      put(slot.memo, "fill", slot.fill, "d", s.fill);
      put(slot.memo, "seam", slot.seam, "d", s.seam);
      put(slot.memo, "ghost", slot.ghost, "d", s.ghost);
      put(slot.memo, "tear", slot.tear, "d", s.tear);
      put(slot.memo, "ink", slot.ink, "d", s.ink);
